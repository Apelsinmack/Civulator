# --- Effects (issue #116 P4, docs/progression_design.md §3 and "v2 fixes") ----
# Any [techs.*], [civics.*], [governments.*], [policies.*], [buildings.*] or
# [districts.*] table may carry `effects = [ { kind = ..., ... }, ... ]`. The
# only interpreter is civulator/effects.py; the kinds are a closed set and each
# has exactly one consumer (effects.CONSUMERS). Unknown kinds or attributes, a
# name that is no unit / building / district / class / era / civic / rule, and
# a `city_yield` effect on a building (say it with a column) raise at load.
# Every entry may carry `scope = "player" | "city"`: buildings and districts
# default to "city" (the effect holds in that city), every other table to
# "player" (it holds everywhere); a policy, government, civic or tech may not
# declare "city". Effects of one kind are summed, then applied once with one
# integer floor (+50 % and +50 % = +100 %).
#   city_yield            science/culture/gold/faith/food/production = N (any subset,
#                         multiples of 0.1); capital_only = true (only in the city
#                         holding [city] capital_building); per_district = true
#                         (times the city's complete specialty districts)
#   production_percent    percent; target = { unit | unit_class | unit_era |
#                         building | district | in_district | kind } (a name or a
#                         list each; every key given must match the item being
#                         produced; in_district = buildings that require that
#                         district; kind = "unit" | "building" | "district" | "wonder")
#   adjacency_percent     district, percent (the district's adjacency yield)
#   combat_strength       applies_to (combat classes, "all" units, or "city"), amount
#   city_ranged_strength  amount
#   upgrade_cost_percent  percent
#   policy_slots          military / economic / wildcard = N (never on a policy)
#   housing_if_districts  amount, min_districts (complete specialty districts; 0 = any city)
#   housing_with_building building, amount
#   enables               rules = ["flanking"]
#   unit_maintenance_delta amount (whole gold per unit and turn, may be negative;
#                         a unit's upkeep never falls below 0)
#   purchase_percent      resource ("gold" | "faith"), percent
#   faith_purchase        categories = ["land_military"] (units of a fighting
#                         combat class may then be bought with faith)
#   trade_route_capacity  amount (a building's counts once per city, Civ 6)
#   route_yield           gold/culture/science/food/production = N per route;
#                         international_only = true
#   loyalty               amount (whole points per round); per_population = true
#                         (times the city's population); requires_garrison = true
#                         (only while a unit of the owner of a fighting class stands
#                         on the centre); range = N (only on a building or district
#                         of scope "player": every own city within N tiles of the
#                         city holding it). A flat loyalty of its own city is the
#                         `loyalty` column, never an effect (#116 P7)
#   growth_percent        percent (the growth bucket, #116 P6)
#   free_units (units = [{ unit, count }]), free_tech / free_civic (count),
#   free_population (amount, all_cities): one-shot, on a wonder's completion
#   only (#116 P6).

# --- Governments (issue #116 P4, docs/progression_design.md §5.2) ------------
# Read only by civulator/research_model.py: requires_civic (the civic that
# unlocks it), tier (int >= 0; a building's requires_government_tier compares
# with the current government's), effects (its policy slots as a
# `policy_slots` effect, then its inherent bonus). Civ 6 Gathering Storm slots,
# with the diplomatic slot folded into wildcard (no city-states, no diplomatic
# cards); legacy bonuses, envoys and favour are dropped. Player.government is
# None until a government is adopted (set_government; the engine default
# adopts the first of a higher tier, game/defaults.py). No anarchy.
[governments.Chiefdom]
requires_civic = "Code of Laws"
tier = 0
effects = [{ kind = "policy_slots", military = 1, economic = 1 }]

# Civ 6 vanilla's Autocracy bonus (the capital +1 to every yield; Gathering
# Storm counts Government Plaza buildings instead, design §5.2).
[governments.Autocracy]
requires_civic = "Political Philosophy"
tier = 1
effects = [
    { kind = "policy_slots", military = 1, economic = 1, wildcard = 2 },
    { kind = "city_yield", food = 1, production = 1, science = 1, culture = 1, gold = 1, faith = 1, capital_only = true },
    { kind = "production_percent", target = { kind = "wonder" }, percent = 10 },
]

# Civ 6 GS: +1 housing (and +1 amenity, not modelled) in every city with a
# district -- read here as a specialty district.
[governments."Classical Republic"]
requires_civic = "Political Philosophy"
tier = 1
effects = [
    { kind = "policy_slots", economic = 2, wildcard = 2 },
    { kind = "housing_if_districts", amount = 1, min_districts = 1 },
]

# Civ 6 GS: land melee and anti-cavalry +4 combat strength (naval melee: no navy).
[governments.Oligarchy]
requires_civic = "Political Philosophy"
tier = 1
effects = [
    { kind = "policy_slots", military = 2, economic = 1, wildcard = 1 },
    { kind = "combat_strength", applies_to = ["melee", "anti_cavalry"], amount = 4 },
]

# Civ 6: +1 housing per level of Walls; +50 % production toward them (the
# vanilla infobox's defensive-building bonus).
[governments.Monarchy]
requires_civic = "Divine Right"
tier = 2
effects = [
    { kind = "policy_slots", military = 2, economic = 1, wildcard = 3 },
    { kind = "housing_with_building", building = "Walls", amount = 1 },
    { kind = "housing_with_building", building = "Medieval Walls", amount = 1 },
    { kind = "production_percent", target = { building = ["Walls", "Medieval Walls"] }, percent = 50 },
]

# Civ 6 vanilla Theocracy (Reformed Church, cut, so Divine Right here): land
# military units may be bought with faith, faith purchases 15 % cheaper.
[governments.Theocracy]
requires_civic = "Divine Right"
tier = 2
effects = [
    { kind = "policy_slots", military = 2, economic = 2, wildcard = 2 },
    { kind = "faith_purchase", categories = ["land_military"] },
    { kind = "purchase_percent", resource = "faith", percent = -15 },
]

# --- Policy cards (issue #116 P4, docs/progression_design.md §5.3) -----------
# Read only by civulator/research_model.py: type (military | economic |
# wildcard), requires_civic, optional obsolete_with (the civic that retires
# it: once known, the card can no longer be slotted and is dropped), effects
# (player scope only). Player.policies is the list of slotted cards; a
# loadout is legal when every card is unlocked and not obsolete, no card twice,
# and the cards fit the government's slots (each card in a slot of its type or
# a wildcard slot): GameEnvironment.set_policies. Civ 6 Gathering Storm cards
# kept where their effect has a consumer here (docs/civ6_progression_reference.md §4).
[policies."God King"]
type = "economic"
requires_civic = "Code of Laws"
obsolete_with = "Theology"
effects = [{ kind = "city_yield", faith = 1, gold = 1, capital_only = true }]

[policies."Urban Planning"]
type = "economic"
requires_civic = "Code of Laws"
effects = [{ kind = "city_yield", production = 1 }]

[policies.Ilkum]
type = "economic"
requires_civic = "Craftsmanship"
effects = [{ kind = "production_percent", target = { unit = "Worker" }, percent = 30 }]   # Civ 6: Builders

[policies.Agoge]
type = "military"
requires_civic = "Craftsmanship"
obsolete_with = "Feudalism"
effects = [{ kind = "production_percent", target = { unit_class = ["melee", "ranged", "anti_cavalry"], unit_era = ["Ancient", "Classical"] }, percent = 50 }]

[policies.Caravansaries]
type = "economic"
requires_civic = "Foreign Trade"
effects = [{ kind = "route_yield", gold = 2 }]   # +2 gold per trade route

[policies.Maneuver]
type = "military"
requires_civic = "Military Tradition"
obsolete_with = "Divine Right"
effects = [{ kind = "production_percent", target = { unit_class = ["light_cavalry", "heavy_cavalry"], unit_era = ["Ancient", "Classical"] }, percent = 50 }]

[policies.Conscription]
type = "military"
requires_civic = "State Workforce"
effects = [{ kind = "unit_maintenance_delta", amount = -1 }]   # -1 gold upkeep per unit

# Civ 6: Ancient and Classical wonders (the wonder's `era` column, #116 P6).
[policies.Corvee]
type = "economic"
requires_civic = "State Workforce"
obsolete_with = "Divine Right"
effects = [{ kind = "production_percent", target = { kind = "wonder", wonder_era = ["Ancient", "Classical"] }, percent = 15 }]

[policies.Colonization]
type = "economic"
requires_civic = "Early Empire"
effects = [{ kind = "production_percent", target = { unit = "Settler" }, percent = 50 }]

[policies.Limitanei]
type = "military"
requires_civic = "Early Empire"
effects = [{ kind = "loyalty", amount = 2, requires_garrison = true }]   # Civ 6: +2 Loyalty in a garrisoned city

[policies.Insulae]
type = "economic"
requires_civic = "Games and Recreation"
obsolete_with = "Medieval Faires"
effects = [{ kind = "housing_if_districts", amount = 1, min_districts = 2 }]

# Civ 6 GS: Encampment and Harbor districts and their buildings.
[policies.Veterancy]
type = "military"
requires_civic = "Military Training"
effects = [
    { kind = "production_percent", target = { district = ["Encampment", "Harbor"] }, percent = 30 },
    { kind = "production_percent", target = { in_district = ["Encampment", "Harbor"] }, percent = 30 },
]

[policies.Scripture]
type = "economic"
requires_civic = "Theology"
effects = [{ kind = "adjacency_percent", district = "Holy Site", percent = 100 }]

[policies.Bastions]
type = "military"
requires_civic = "Defensive Tactics"
effects = [
    { kind = "combat_strength", applies_to = "city", amount = 6 },
    { kind = "city_ranged_strength", amount = 5 },
]

# Civ 6: +100 % production toward defensive buildings (the walls).
[policies.Limes]
type = "military"
requires_civic = "Defensive Tactics"
effects = [{ kind = "production_percent", target = { building = ["Walls", "Medieval Walls"] }, percent = 100 }]

[policies."Natural Philosophy"]
type = "economic"
requires_civic = "Recorded History"
effects = [{ kind = "adjacency_percent", district = "Campus", percent = 100 }]

[policies."Feudal Contract"]
type = "military"
requires_civic = "Feudalism"
effects = [{ kind = "production_percent", target = { unit_class = ["melee", "ranged", "anti_cavalry"], unit_era = ["Ancient", "Classical", "Medieval", "Renaissance"] }, percent = 50 }]

# Civ 6: newly trained Builders gain 2 extra build actions (#127). Obsolete in
# Civ 6 with Civil Engineering, which is not in our tree, so never here.
[policies.Serfdom]
type = "economic"
requires_civic = "Feudalism"
effects = [{ kind = "build_charges_trained", amount = 2 }]

# The Civ 6 vanilla card (removed in Rise and Fall): +1 culture per specialty district.
[policies.Meritocracy]
type = "economic"
requires_civic = "Civil Service"
effects = [{ kind = "city_yield", culture = 1, per_district = true }]

[policies."Professional Army"]
type = "military"
requires_civic = "Mercenaries"
effects = [{ kind = "upgrade_cost_percent", percent = -50 }]

[policies."Trade Confederation"]
type = "economic"
requires_civic = "Mercenaries"
effects = [{ kind = "route_yield", culture = 1, science = 1, international_only = true }]

[policies.Aesthetics]
type = "economic"
requires_civic = "Medieval Faires"
effects = [{ kind = "adjacency_percent", district = "Theater Square", percent = 100 }]

[policies."Medina Quarter"]
type = "economic"
