# Civulator — Game Configuration
# Hot-reloadable settings. Modify and restart training to apply.

[map]
rows = 24
columns = 48
type = "earthlike"       # "earthlike" (default, Duel-size minimum, E5) | "basic"

# =====================================================================
# Earthlike world generation (v0.6, docs/terrain_model_design.md §4.3/§4.4,
# §11 P3) — civulator/mapgen/earthlike.py DEFAULT_PARAMS mirrors every key
# below (config overrides those code defaults; civulator.mapgen itself
# never reads this file — Map.generate_map reads it once and passes the
# resolved dict down, design doc §4.1). Values not pinned by the design doc
# are this patch's own tuning, not claimed as "the" earthlike numbers — see
# the P3 implementation report for the reasoning behind each one.
# =====================================================================
[map.earthlike]
continent_wavelength = 3       # coarsest-octave period P_0 (m in P_k = m*2^k); "m ~ 3-4" per §4.3
octaves = "auto"                # "auto" -> clamp(round(log2(width)) - 2, 3, 9); or an explicit int
mountain_wavelength = 5         # orogeny-mask noise period
mountain_belt_percent = 0.35    # nearest-rank fraction of the map that is mountain-belt-eligible
mountain_amp = 1.5              # amp in E = continentalness + amp * orogeny_mask * ridged
warp_amp = 4.0                  # domain-warp displacement, in hex-center units
warp_octaves = 3
land_percent = 0.35             # whole-map nearest-rank fraction that becomes land (sea level)
mountain_percent = 0.08         # fraction OF LAND that becomes mountain relief
hill_percent = 0.20             # fraction OF LAND that becomes hill relief (cumulative with mountain)
smooth_iterations = 3           # talus-smoothing Jacobi iteration count (design doc §4.2 rule 5)
talus_slope = 0.08              # max elevation delta between neighbors before diffusion
diffusion_coeff = 0.4           # fraction of excess slope that diffuses per talus iteration
lake_max_size = 12              # connected water components <= this many tiles become Lake
temp_wobble_amp = 0.3           # coherent temperature-band-boundary wobble amplitude
temp_wobble_wavelength = 4
temp_lapse_rate = 0.8           # temperature lost per unit elevation above sea level
temp_snow_percentile = 0.25     # PW3 starting number (§4.4): coldest 25% of land -> Snow
temp_tundra_percentile = 0.30   # next up to 30th percentile -> Tundra
moisture_wavelength = 5
moisture_octaves = 4
moisture_desert_percentile = 0.36  # PW3 starting number (§4.4): driest 36% of (warm) land -> Desert
moisture_plains_percentile = 0.56  # next up to 56th percentile -> Plains; rest -> Grassland
river_percent = 0.18            # P4 — inert until rivers generate
river_moisture_bonus = 0.1      # P4 — inert until rivers generate

[map.earthlike.feature_chance]
# Per-tile hash-roll probability (design doc §4.2 rule 3), applied only to
# tiles that already pass BOTH the structural `on` gate and this stage's
# climate-band gate (civulator/mapgen/features.py).
woods = 0.35
rainforest = 0.50
marsh = 0.15
ice = 0.70
reef = 0.30

# =====================================================================
# Map size presets (design doc §6, D14): rows/cols (never W x H — kills the
# transposition ambiguity) + default/max players. GameEnvironment preset
# RESOLUTION (selecting a size by name) is P5 scope; the mapgen preview CLI
# (`python -m civulator.mapgen --size NAME`) already resolves through this
# table (civulator/mapgen/data.py:resolve_size).
# =====================================================================
[map.sizes.duel]
rows = 12
cols = 24
default_players = 2
max_players = 3

[map.sizes.tiny]
rows = 16
cols = 32
default_players = 3
max_players = 4

[map.sizes.small]
rows = 20
cols = 40
default_players = 4
max_players = 6

[map.sizes.standard]
rows = 24
cols = 48
default_players = 6
max_players = 8

[map.sizes.large]
rows = 32
cols = 64
default_players = 8
max_players = 12

[map.sizes.huge]
rows = 42
cols = 84
default_players = 12
max_players = 16

[map.sizes.colossal]
rows = 66
cols = 106
default_players = 12
max_players = 24

# --- "basic" generator (design doc §4.1, §11 P3): iid per-tile terrain, the
# deliberately simple option — same weight table pre-0.6 had, now consumed
# by civulator/mapgen/basic.py instead of the deleted engine-level shim. ---
[map.terrain_weights]
# Relative weights for terrain generation (will be normalized)
Plains = 0.30
Grassland = 0.30
Desert = 0.10
Tundra = 0.10
Hills = 0.10
Woods = 0.05
Mountain = 0.05

[map.features]
# Probability of adding features to eligible terrain
woods_chance = 0.2       # Plains, Grassland, Tundra
rainforest_chance = 0.1  # Plains, Grassland

# =====================================================================
# Composable terrain model (v0.6, docs/terrain_model_design.md §3.1) — ADDITIVE.
# Every gameplay number a tile has is the SUM of its layers' contributions
# (base x relief x feature x resource), interpreted by civulator.terrain_model
# and read by the engine through Tile's composed properties. Line of sight is
# `los = [obstacle, vantage]`: you see distance 2 + vantage, and an obstacle
# blocks when its level exceeds the observer's vantage.
#
# P2a removed the legacy [terrain.movement_costs] / [terrain.defense_modifiers] /
# [terrain.los] tables (and the Terrain class that merged them) — this schema is
# now the only source. [map.terrain_weights] / [map.features] above still feed
# the interim world-gen shim in Map.generate_map; patch P3 replaces both with
# the mapgen package.
# =====================================================================

# --- Base terrains: land ---
[terrain.base.Grassland]
yields = [2, 0]
movement = 1
defense = 0
los = [0, 0]
domain = "land"

[terrain.base.Plains]
yields = [1, 1]
movement = 1
defense = 0
los = [0, 0]
domain = "land"

[terrain.base.Desert]
yields = [0, 0]
movement = 1
defense = 0
los = [0, 0]
domain = "land"

[terrain.base.Tundra]
yields = [1, 0]
movement = 1
defense = 0
los = [0, 0]
domain = "land"

[terrain.base.Snow]
yields = [0, 0]
movement = 1
defense = 0
los = [0, 0]
domain = "land"

# --- Base terrains: water ---
[terrain.base.Coast]
yields = [1, 0]
movement = 1
defense = 0
los = [0, 0]
domain = "water"

[terrain.base.Lake]
yields = [2, 0]
movement = 1
defense = 0
los = [0, 0]
domain = "water"

[terrain.base.Ocean]
yields = [1, 0]
movement = 1
defense = 0
los = [0, 0]
domain = "water"

# --- Relief (land only; water is always flat, §3) ---
[terrain.relief.flat]
yields = [0, 0]
movement = 0
defense = 0
los = [0, 0]

[terrain.relief.hills]
yields = [0, 1]
movement = 1             # additive: Grassland + hills costs 2
defense = 3
los = [1, 1]

[terrain.relief.mountain]
yields = [0, 0]
movement = 0              # blocking comes from `impassable`, not a cost sentinel (D6)
defense = 0
los = [3, 0]
impassable = true

# --- Features (<=1 per tile) ---
[terrain.feature.Woods]
yields = [0, 1]
movement = 1
defense = 3
los = [1, 0]
on = { bases = ["Plains", "Grassland", "Tundra"], relief = ["flat", "hills"] }

[terrain.feature.Rainforest]
yields = [1, 0]
movement = 1
defense = 3
los = [1, 0]
on = { bases = ["Plains"], relief = ["flat", "hills"] }

[terrain.feature.Marsh]
yields = [1, 0]
movement = 1
defense = -2
los = [0, 0]
on = { bases = ["Grassland"], relief = ["flat"] }

[terrain.feature.Floodplains]
yields = [3, 0]
movement = 0
defense = -2
los = [0, 0]
on = { bases = ["Desert"], relief = ["flat"] }
# "along rivers" (§3) is a river-edge/adjacency condition, out of scope for
# this per-tile base/relief/feature evaluator — enforced at generation time
# (mapgen, patch P4), not here.

[terrain.feature.Oasis]
yields = [3, 0]
movement = 0
defense = 0
los = [0, 0]
on = { bases = ["Desert"], relief = ["flat"] }
# "no river on-tile, no adjacent water/Oasis/Floodplains" (§3) is likewise a
# spatial condition enforced by the generator (P4), not by this evaluator.

[terrain.feature.Reef]
yields = [1, 1]
movement = 0
defense = 0
los = [0, 0]
on = { bases = ["Coast"] }

[terrain.feature.Ice]
yields = [0, 0]
movement = 0
defense = 0
los = [0, 0]
on = { bases = ["Coast", "Ocean"] }
# "polar" (§3) is a latitude condition, enforced by the generator (P3/P4).

# --- Resources (bonus tier, §3.2; luxury/strategic ship schema-ready via `class`) ---
[terrain.resource.Wheat]
class = "bonus"
yields = [1, 0]
# Civ 6: Wheat sits on flat Plains, or on Desert Floodplains. The single
# AND-of-ORs mapping the design doc sketched (bases=["Plains"],
# features=["none","Floodplains"]) is unsatisfiable on its Floodplains branch —
# Floodplains only exist on Desert — so this uses the list-of-mappings form.
on = [
    { bases = ["Plains"], relief = ["flat"], features = ["none"] },
    { bases = ["Desert"], relief = ["flat"], features = ["Floodplains"] },
]

[terrain.resource.Rice]
class = "bonus"
yields = [1, 0]
on = { bases = ["Grassland"], relief = ["flat"], features = ["none", "Marsh"] }

[terrain.resource.Cattle]
class = "bonus"
yields = [1, 0]
on = { bases = ["Grassland"], relief = ["flat"], features = ["none"] }

[terrain.resource.Sheep]
class = "bonus"
yields = [0, 1]
on = { relief = ["hills"], features = ["none"] }

[terrain.resource.Stone]
class = "bonus"
yields = [0, 1]
on = { bases = ["Grassland"], relief = ["flat", "hills"], features = ["none"] }

[terrain.resource.Deer]
class = "bonus"
yields = [0, 1]
# "Woods or Tundra" (§3.2) is a disjunction across dimensions that a single
# AND-of-ORs mapping cannot express — `on` as a list of mappings means valid
# if ANY one matches (civulator/terrain_model.py check_on/_match).
on = [
    { features = ["Woods"] },
    { bases = ["Tundra"] },
]

[terrain.resource.Bananas]
class = "bonus"
yields = [1, 0]
on = { features = ["Rainforest"] }

[terrain.resource.Fish]
class = "bonus"
yields = [1, 0]
on = { bases = ["Coast", "Lake"] }

[terrain.river]
crossing_cost = 1

# --- Improvements (§3.1: the same `on` formalism as terrain layers) ---
# Consumed by GameEnvironment.can_build_improvement_at / build_improvement.
# These mirror the hardcoded terrain lists P2a replaced: the legacy flat
# terrain names "Hills" and "Floodplains" become a relief and a feature
# constraint, and features were never checked (a Woods Plains tile always
# allowed a Farm), so only the mappings below constrain them.
# An improvement without an `on` key is buildable nowhere.

[improvements.Farm]
on = [
    { bases = ["Plains", "Grassland", "Desert"], relief = ["flat"] },
    { features = ["Floodplains"] },
]

[improvements.Mine]
on = [
    { relief = ["hills"] },
    { bases = ["Desert", "Tundra", "Snow"], relief = ["flat"] },
]

[improvements.Plantation]
on = { bases = ["Plains", "Grassland", "Desert"], relief = ["flat"] }

[improvements.Camp]
on = { bases = ["Plains", "Grassland", "Tundra", "Desert"], relief = ["flat"] }

[improvements.Pasture]
on = { bases = ["Plains", "Grassland", "Desert", "Tundra"], relief = ["flat"] }

[improvements.Quarry]
on = { bases = ["Plains", "Desert", "Grassland", "Tundra"], relief = ["flat"] }

[improvements."Fishing Boats"]
on = { bases = ["Coast", "Lake"] }

[improvements."Oil Well"]
on = [
    { bases = ["Desert", "Tundra", "Snow"], relief = ["flat"] },
    { bases = ["Coast", "Ocean"] },
]

[game]
num_players = 8
max_turns = 1000
starting_warriors = 3
min_city_distance = 3    # Minimum hex distance between cities

[training]
episodes = 64
batch_size = 32
max_turns = 250
learning_rate = 0.001
gamma = 0.9
epsilon_start = 1.0
epsilon_end = 0.05
epsilon_decay_episodes = 5000
target_update_freq = 100 # Sync target network every N optimization steps
encoder = "enhanced"     # "basic" (5ch) or "enhanced" (25ch)
fully_conv = true        # Must be true for large maps (no FC layers)
fog_of_war = false       # true: enhanced encoder applies visibility (27ch — hidden/explored/visible)

[training.rewards]
invalid_action = -1
fortify = 0
damage_per_hp = 0.1
kill = 10
unit_lost = -10
capture_civilian = 15
capture_city = 20
found_city = 15
