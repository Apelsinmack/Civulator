kind = "wonder"
era = "Ancient"
production_cost = 220
requires_tech = "Masonry"
cost_model = "fixed"
counts_toward_limit = false
max_per_city = 1
max_per_player = 1
on = { relief = ["flat"], bases = ["Desert", "Plains"] }
culture = 2
effects = [
    { kind = "free_units", units = [{ unit = "Worker", count = 1 }] },
    { kind = "build_charges", amount = 1, scope = "player" },
