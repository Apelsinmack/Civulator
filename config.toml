effects = [{ kind = "housing_if_districts", amount = 2, min_districts = 3 }]

[policies.Craftsmen]
type = "economic"
requires_civic = "Guilds"
effects = [{ kind = "adjacency_percent", district = "Industrial Zone", percent = 100 }]

[policies."Town Charters"]
type = "economic"
requires_civic = "Guilds"
effects = [{ kind = "adjacency_percent", district = "Commercial Hub", percent = 100 }]

# Civ 6: Industrial era and earlier, i.e. every era of this block.
[policies.Chivalry]
type = "military"
requires_civic = "Divine Right"
effects = [{ kind = "production_percent", target = { unit_class = ["light_cavalry", "heavy_cavalry"] }, percent = 50 }]

# Civ 6: Ancient to Renaissance wonders (every era of the tree).
[policies."Gothic Architecture"]
type = "economic"
requires_civic = "Divine Right"
effects = [{ kind = "production_percent", target = { kind = "wonder", wonder_era = ["Ancient", "Classical", "Medieval", "Renaissance"] }, percent = 15 }]

# --- Buildings (issue #7) ---------------------------------------------------
# One table per building: `production_cost` is what a city pays for it, and
# `defense_bonus` (optional, default 0) is added to the city's defensive combat
# strength for as long as it stands. Read only by civulator/unit_model.py;
# City.BUILDING_COSTS and City.get_combat_strength are aliases of what it
# interprets, never a second copy of these numbers.
# Yield columns (optional, default 0, multiples of 0.1; #87 culture, #116 the
# rest): `science`, `culture`, `gold`, `faith` per turn into the owner's pools,
# `food` and `production` per turn into the city's own — all read by
# civulator/game/yields.py city_yield, never by name. `loyalty` (optional,
# default 0, whole points, #116 P7): per round into the city's loyalty, read by
# civulator/game/loyalty.py.
# Availability columns (#116 P2, all optional; checked by
# civulator/game/availability.py city_can_build_building, the one predicate
# production, the build mask and purchasing call):
#   requires_tech      a [techs.*] name the owner must know
#   requires_district  a [districts.*] name: a COMPLETE district of that type
#                      must stand in the city
#   requires_building  a [buildings.*] name the city must already own
#   requires_civic     a [civics.*] name the owner must know (#116 P4)
#   requires_government_tier
#                      the owner's current government must be of at least this
#                      tier (no government = below every tier; #116 P4)
#   maintenance        gold per turn (multiple of 0.1, default 0), deducted in
#                      the owner's economy phase (#116 P5)
#   purchasable        resources that may buy it, default ["gold"]; [] = never
#                      bought (GameEnvironment.purchase, #116 P5)
#   effects            optional; city scope by default (see Effects above). A
#                      yield is a column, never a `city_yield` effect.
# Civ 6 Gathering Storm values (docs/civ6_progression_reference.md §7);
# design: docs/progression_design.md §6.2. The Factory is removed (v0.8.0):
# it is beyond the tree (Industrialization).
[buildings.Granary]
production_cost = 60
requires_tech = "Pottery"
housing = 2         # optional column (default 0); Civ 6 Granary. A multiple of 0.1
food = 1            # rule change v0.8.0 (#116 P1): Civ 6 Granary +1 Food
                    # (docs/civ6_progression_reference.md §7)

[buildings.Monument]
production_cost = 50
culture = 2         # optional column (default 0); Civ 6 Monument. A multiple of 0.1
loyalty = 1         # optional column (default 0, whole points); Civ 6 Monument +1 Loyalty

# Walls: +30 defence, Civ 6's Ancient Walls (see CHANGELOG). The building
# that unlocks the city's ranged strike ([city] ranged_building).
[buildings.Walls]
production_cost = 100
requires_tech = "Masonry"
defense_bonus = 30
purchasable = []    # Civ 6: walls cannot be bought

# Workshop: Civ 6's cost and yield (v0.8.0; it was 120 and inert).
[buildings.Workshop]
production_cost = 195
requires_tech = "Apprenticeship"
requires_district = "Industrial Zone"
production = 3
maintenance = 1

[buildings.Library]
production_cost = 90
requires_tech = "Writing"
requires_district = "Campus"
science = 2
maintenance = 1

[buildings.University]
production_cost = 250
requires_tech = "Education"
requires_district = "Campus"
requires_building = "Library"
science = 4
housing = 1
maintenance = 2

[buildings.Shrine]
production_cost = 70
requires_tech = "Astrology"
requires_district = "Holy Site"
faith = 2
maintenance = 1
purchasable = ["gold", "faith"]

[buildings.Temple]
production_cost = 120
requires_civic = "Theology"
requires_district = "Holy Site"
requires_building = "Shrine"
faith = 4
maintenance = 2
purchasable = ["gold", "faith"]

[buildings.Amphitheater]
production_cost = 150
requires_civic = "Drama and Poetry"
requires_district = "Theater Square"
culture = 2
maintenance = 1

# Government Plaza buildings (Civ 6 Rise and Fall): one per tier of
# government adopted. Their Civ 6 governor titles and the Tier-1 siblings
# (Audience Chamber, Warlord's Throne) are not modelled; neither can be bought.
[buildings."Ancestral Hall"]
production_cost = 150
requires_government_tier = 1
requires_district = "Government Plaza"
maintenance = 1
purchasable = []
effects = [{ kind = "production_percent", target = { unit = "Settler" }, percent = 50 }]   # in this city

[buildings."Grand Master's Chapel"]
production_cost = 290
requires_government_tier = 2
requires_district = "Government Plaza"
requires_building = "Ancestral Hall"
faith = 5
maintenance = 2
purchasable = []
# Civ 6: land military units may be bought with faith in EVERY city of the
# owner, so the effect is player-scoped (a building's default is its own city).
effects = [{ kind = "faith_purchase", categories = ["land_military"], scope = "player" }]

[buildings.Barracks]
production_cost = 90
requires_tech = "Bronze Working"
requires_district = "Encampment"
production = 1
housing = 1
maintenance = 1

# Market and Lighthouse (#116 P5; Civ 6 Gathering Storm, docs/
# civ6_progression_reference.md §7, §10): +1 trade route capacity each, but a
# city holding both adds 1 (game/trade.py route_capacity counts a building's
# capacity once per city). The wiki gives neither an upkeep: 0.
[buildings.Market]
production_cost = 120
requires_tech = "Currency"
requires_district = "Commercial Hub"
gold = 3
maintenance = 0
effects = [{ kind = "trade_route_capacity", amount = 1 }]

[buildings.Lighthouse]
production_cost = 120
requires_tech = "Celestial Navigation"
requires_district = "Harbor"
food = 1
gold = 1
housing = 1
maintenance = 0
effects = [{ kind = "trade_route_capacity", amount = 1 }]

# Medieval Walls: a second +30 on top of the Walls (Civ 6: +100 outer
# defence each); no maintenance (Civ 6).
[buildings."Medieval Walls"]
production_cost = 220
requires_tech = "Castles"
requires_building = "Walls"
defense_bonus = 30
purchasable = []

# Palace (#88): granted to a player's first city by GameEnvironment.create_city,
# never built (no production_cost, so City.produce_building refuses it).
[buildings.Palace]
housing = 1
purchasable = []
# Rule change v0.8.0 (#116 P1): the Civ 6 Palace's yields, +2 Science, +5 Gold,
# +2 Production (docs/civ6_progression_reference.md §7). Its +1 Culture stays
# in [culture] base, which every city already gets (design §0.3).
science = 2
gold = 5
production = 2
# Civ 6 (Rise and Fall): +1 Loyalty per turn for each citizen of its city
# (#116 P7, docs/progression_design.md §8.2).
effects = [{ kind = "loyalty", amount = 1, per_population = true }]

# --- Districts (issue #86, docs/districts_design.md) ------------------------
# Civ 6 Gathering Storm values. Read only by civulator/district_model.py.
# Scalars first; every sub-table is one district (names with spaces quoted;
# "City Center" and "any" are reserved). Per district:
#   production_cost      base cost (positive int)
#   cost_model           "discounted" | "progress" | "fixed" (design §4)
#   discount_percent     int, for "discounted"
#   counts_toward_limit  takes a population slot (default true)
#   max_per_city         default 1;  max_per_player: absent = unlimited (a wonder
#                        declares max_per_player = 1: once a city of a player has
#                        placed one, no other city of that player may -- Civ 6)
#   adjacency_yield      what the adjacency score becomes (§5): culture,
#                        production, science, gold, faith or none (default)
#   adjacency            rows { amount, per (default 1), <one source> } (§1.2);
#                        each row floored separately: floor(count/per)*amount
#   on                   terrain mapping for the district's own tile; absent = land
#                        (present = exactly what it says: spell "flat land" with
#                        the land bases, since water is flat too)
#   adjacent_to_city_center   true = required, false = forbidden, absent = either
#   requires_adjacent    sources of which at least one must hold (§2)
#   requires_adjacent_all  sources of which every one must hold (#116 P6)
#   kind                 "district" (default) or "wonder" (#116 P6, progression
#                        design §9). A wonder declares era (one of [research]'s
#                        eras), counts_toward_limit = false, cost_model =
#                        "fixed", max_per_city = 1, max_per_player = 1 and no
#                        adjacency_yield, adjacency or discount_percent (the
#                        loader raises otherwise); it is world-unique (refused once any player
#                        completed it), and when it completes every other copy is
#                        removed, its city refunded [wonders] consolation_percent
#                        of that copy's locked cost. Its one-shot effects
#                        (free_units, free_tech, free_civic, free_population)
#                        fire once, on completion.
#   era                  a wonder's era (wonders only)
#   science, culture, gold, faith, food, production
#                        optional flat per-turn yields of the complete district
#                        (multiples of 0.1, default 0; #116, read by city_yield);
#                        none declared today
#   loyalty              optional whole points per round into its city's loyalty
#                        once complete (default 0; #116 P7, read by game/loyalty.py)
#   requires_tech        a [techs.*] name the owner must know to place it
#                        (#116 P2; checked through can_place_district)
#   requires_civic       a [civics.*] name the owner must know to place it (#116 P4)
#   effects              optional, city scope by default (see Effects above)
#   maintenance          gold per turn (multiple of 0.1, default 0; Civ 6:
#                        the gold districts pay for themselves), deducted for
#                        a complete district in the owner's economy phase (#116 P5)
# Sources: terrain = {bases/relief/features/resources} (terrain_model `on`
# form), improvement = [...], district = [...] | "any" ("City Center" names a
# city centre; "any" = any district or centre, never a wonder; a list names
# districts only), wonder = "any" (every adjacent COMPLETE wonder, #116 P6),
# river_on_tile = true (a tile test: a river along any edge of the tile; in
# adjacency rows and, since #116 P6, in requires lists),
# river_edge_not_shared_with_center = true (requires lists only).
[districts]
population_per_district = 3   # specialty districts allowed = 1 + floor((pop - 1) / 3)
cost_progress_factor = 9      # cost = base * (1 + 9 * P); P = the larger of techs known / techs and civics known / civics (#116 P2, P4)
removable_features = ["Woods", "Rainforest", "Marsh"]   # cleared on placement
allowed_features = ["Floodplains"]                      # kept on placement

[districts.Campus]
production_cost = 54
requires_tech = "Writing"
maintenance = 1
cost_model = "discounted"
discount_percent = 40
adjacency_yield = "science"
adjacency = [
    { amount = 1, terrain = { relief = ["mountain"] } },
    { amount = 1, per = 2, terrain = { features = ["Rainforest"] } },
    { amount = 2, terrain = { features = ["Reef"] } },
    { amount = 1, per = 2, district = "any" },
    { amount = 1, district = ["Government Plaza"] },
]

[districts."Commercial Hub"]
production_cost = 54
requires_tech = "Currency"
cost_model = "discounted"
discount_percent = 40
adjacency_yield = "gold"
adjacency = [
    { amount = 2, river_on_tile = true },
    { amount = 2, district = ["Harbor"] },
    { amount = 1, per = 2, district = "any" },
    { amount = 1, district = ["Government Plaza"] },
]

[districts."Theater Square"]
production_cost = 54
requires_civic = "Drama and Poetry"
maintenance = 1
cost_model = "discounted"
discount_percent = 40
adjacency_yield = "culture"
adjacency = [
    { amount = 2, wonder = "any" },   # Civ 6: +2 per adjacent wonder (#116 P6)
    { amount = 2, district = ["Entertainment Complex"] },
    { amount = 1, per = 2, district = "any" },
    { amount = 1, district = ["Government Plaza"] },
]

[districts."Holy Site"]
production_cost = 54
requires_tech = "Astrology"
maintenance = 1
cost_model = "discounted"
discount_percent = 40
adjacency_yield = "faith"
adjacency = [
    { amount = 1, terrain = { relief = ["mountain"] } },
    { amount = 1, per = 2, terrain = { features = ["Woods"] } },
    { amount = 1, per = 2, district = "any" },
    { amount = 1, district = ["Government Plaza"] },
]

[districts."Industrial Zone"]
production_cost = 54
requires_tech = "Apprenticeship"
maintenance = 1
cost_model = "discounted"
discount_percent = 40
adjacency_yield = "production"
adjacency = [
    { amount = 2, district = ["Aqueduct"] },
    { amount = 1, improvement = ["Quarry"] },
    { amount = 1, per = 2, improvement = ["Mine"] },
    { amount = 1, per = 2, district = "any" },
    { amount = 1, district = ["Government Plaza"] },
]

# Harbor: on Coast or Lake, adjacent to land (a mountain's base is land).
# "Not on Reef" needs no rule here: Reef is in neither removable_features nor
# allowed_features, so the general feature rule refuses it.
[districts.Harbor]
production_cost = 54
requires_tech = "Celestial Navigation"
cost_model = "discounted"
discount_percent = 40
adjacency_yield = "gold"
on = { bases = ["Coast", "Lake"] }
requires_adjacent = [
    { terrain = { bases = ["Grassland", "Plains", "Desert", "Tundra", "Snow"] } },
]
adjacency = [
    { amount = 2, district = ["City Center"] },
    { amount = 1, terrain = { bases = ["Coast", "Lake", "Ocean"], resources = ["any"] } },
    { amount = 1, per = 2, district = "any" },
    { amount = 1, district = ["Government Plaza"] },
]

[districts.Encampment]
production_cost = 54
requires_tech = "Bronze Working"
maintenance = 1
cost_model = "discounted"
discount_percent = 40
adjacent_to_city_center = false

[districts."Entertainment Complex"]
production_cost = 54
requires_civic = "Games and Recreation"
maintenance = 1
cost_model = "discounted"
discount_percent = 40

[districts."Government Plaza"]
production_cost = 30
requires_civic = "State Workforce"
loyalty = 8         # Civ 6: +8 Loyalty per turn to its city (#116 P7)
cost_model = "discounted"
discount_percent = 25
max_per_player = 1

# Aqueduct: next to the centre and to a river (on an edge not shared with the
# centre), a lake, an oasis or a mountain. Water housing (§6, applied in D2):
# water = max(water_housing_min, water + water_housing_boost).
[districts.Aqueduct]
production_cost = 36
requires_tech = "Engineering"
cost_model = "progress"
counts_toward_limit = false
adjacent_to_city_center = true
requires_adjacent = [
    { river_edge_not_shared_with_center = true },
    { terrain = { bases = ["Lake"] } },
    { terrain = { features = ["Oasis"] } },
    { terrain = { relief = ["mountain"] } },
]
water_housing_min = 6
water_housing_boost = 2

# --- Wonders (#116 P6, docs/progression_design.md §9) -------------------------
# District-registry tables with kind = "wonder" (see the district columns
# above). Civ 6 Gathering Storm costs (docs/civ6_progression_reference.md §5);
# requirements moved where a cut tech or civic held them; placement in the
# district vocabulary. "Flat" is spelled with the land bases (water is flat).
# Yields and housing are columns of the complete wonder in its city; effects
# hold in its city (scope "city", the district default) or, with scope =
# "player", in every city of its owner. Civ 6's "+2 tiles on completion" and
# the amenity effects are not implemented (borders and amenities, #96).

# Civ 6: Desert only; here Desert or Plains (design §9.4). Its Civ 6 effect
