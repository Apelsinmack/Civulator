# --- Culture: the civics tree (issue #116 P4, docs/progression_design.md §5.1) ---
# Read only by civulator/research_model.py, with the same parser as the techs
# (parse_tree): cost (Civ 6 Gathering Storm culture, Standard speed), era,
# requires (civics; absent = available from the start), optional effects
# (interpreted by civulator/effects.py). Culture (Player.culture, tenths) pays
# for one civic at a time: GameEnvironment.resolve_civic. Names, eras and
# costs are Civ 6's (docs/civ6_progression_reference.md §2); prerequisites
# are this design's where a cut civic (Mysticism, Naval Tradition, the
# Renaissance) sat in between. What a civic unlocks is never declared here:
# it is the `requires_civic` column of the unlocked item's own table
# (units, buildings, districts, governments, policies).
[civics."Code of Laws"]
cost = 20
era = "Ancient"

[civics.Craftsmanship]
cost = 40
era = "Ancient"
requires = ["Code of Laws"]

[civics."Foreign Trade"]
cost = 40
era = "Ancient"
requires = ["Code of Laws"]
effects = [{ kind = "trade_route_capacity", amount = 1 }]   # Civ 6: +1 Trade Route capacity (game/trade.py route_capacity)

[civics."Military Tradition"]
cost = 50
era = "Ancient"
requires = ["Craftsmanship"]
# Civ 6: grants the flanking (and support) combat bonus. Flanking (#59) is
# off until a player knows this civic (the `flanking` rule's gate,
# Unit.get_combat_strength); support bonuses are not modelled.
effects = [{ kind = "enables", rules = ["flanking"] }]

[civics."State Workforce"]
cost = 70
era = "Ancient"
requires = ["Craftsmanship"]

[civics."Early Empire"]
cost = 70
era = "Ancient"
requires = ["Foreign Trade"]

[civics."Games and Recreation"]
cost = 110
era = "Classical"
requires = ["State Workforce"]

[civics."Political Philosophy"]
cost = 110
era = "Classical"
requires = ["State Workforce", "Early Empire"]

[civics."Drama and Poetry"]
cost = 110
era = "Classical"
requires = ["Early Empire"]

[civics."Military Training"]
cost = 120
era = "Classical"
requires = ["Military Tradition"]   # Civ 6: + Games and Recreation

[civics.Theology]
cost = 120
era = "Classical"
requires = ["Drama and Poetry"]     # Civ 6: + Mysticism (cut)

[civics."Defensive Tactics"]
cost = 175
era = "Classical"
requires = ["Games and Recreation", "Political Philosophy"]

[civics."Recorded History"]
cost = 175
era = "Classical"
requires = ["Drama and Poetry", "Political Philosophy"]

[civics.Feudalism]
cost = 300
era = "Medieval"
requires = ["Defensive Tactics"]

[civics."Civil Service"]
cost = 300
era = "Medieval"
requires = ["Defensive Tactics", "Recorded History"]

[civics.Mercenaries]
cost = 340
era = "Medieval"
requires = ["Feudalism", "Military Training"]

[civics."Divine Right"]
cost = 340
era = "Medieval"
requires = ["Civil Service", "Theology"]

[civics."Medieval Faires"]
cost = 420
era = "Medieval"
requires = ["Feudalism"]

[civics.Guilds]
