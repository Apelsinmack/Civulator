# Civulator — Game Configuration
# Hot-reloadable settings. Modify and restart training to apply.

[map]
rows = 4
columns = 8
type = "basic"           # "basic" = random terrain

[map.terrain_weights]
# Relative weights for terrain generation (will be normalized)
Plains = 0.30
Grassland = 0.30
Desert = 0.10
Tundra = 0.10
Hills = 0.10
Woods = 0.05
Mountain = 0.05

[map.features]
# Probability of adding features to eligible terrain
woods_chance = 0.2       # Plains, Grassland, Tundra
rainforest_chance = 0.1  # Plains, Grassland

[terrain.movement_costs]
Plains = 1
Grassland = 1
Desert = 1
Tundra = 1
Snow = 1
Hills = 2
Woods = 2
Rainforest = 2
Marsh = 2
Floodplains = 1
Mountain = 999           # Impassable
Ocean = 1
Coast = 1
Lake = 1

[terrain.defense_modifiers]
Plains = 0
Grassland = 0
Desert = 0
Tundra = 0
Snow = 0
Hills = 3
Woods = 3
Rainforest = 3
Marsh = -2
Floodplains = -2
Mountain = 0
Ocean = 0
Coast = 0
Lake = 0

# --- Line of Sight ---
# Each terrain has an obstacle_level and a vantage_level.
# You can see tiles at distance = 1 + max(0, your_vantage - obstacle_level_between)
# This is a placeholder system — refine as we test gameplay.
[terrain.los]
# [obstacle_level, vantage_level]
Plains =     [0, 0]
Grassland =  [0, 0]
Desert =     [0, 0]
Tundra =     [0, 0]
Snow =       [0, 0]
Hills =      [1, 1]     # Blocks flat-level sight, but lets you see further
Woods =      [1, 0]     # Blocks sight, no vantage
Rainforest = [1, 0]
Marsh =      [0, 0]
Floodplains = [0, 0]
Mountain =   [2, 0]     # Fully blocks LoS, can't stand on it
Ocean =      [0, 0]
Coast =      [0, 0]
Lake =       [0, 0]

[game]
num_players = 2
max_turns = 1000
starting_warriors = 3
min_city_distance = 3    # Minimum hex distance between cities

[training]
episodes = 64
batch_size = 32
max_turns = 250
learning_rate = 0.001
gamma = 0.9
epsilon_start = 1.0
epsilon_end = 0.05
epsilon_decay_episodes = 50000
encoder = "basic"        # "basic" (5ch) or "enhanced" (25ch)
fully_conv = false

[training.rewards]
invalid_action = -1
fortify = 0
damage_per_hp = 0.1
kill = 10
capture_civilian = 15
capture_city = 20
found_city = 15
