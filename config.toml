# --- Combat formula constants (Civ6-inspired modifier stacking, #60/#63) ---
[combat]
# Class-pair modifiers (#116 P3; replaces anti_cavalry_bonus,
# melee_vs_spearman_bonus and archer_vs_horseman_penalty, which named units).
# One row = { unit, target, amount, strength }:
#   unit, target  a combat_class OR a single unit type name (a row matches a
#                 unit by its name or by its class; a name may not equal a class)
#   amount        added to `unit`'s strength against `target` (negative = penalty)
#   strength      "combat" -> read by Unit.get_combat_strength, in BOTH roles
#                            (attacking and defending, #63: a Spearman standing
#                            still still gets its bonus);
#                 "ranged" -> read only by Unit.get_ranged_strength, i.e. by the
#                            shooter against its target.
# Rows apply in this order; the only interpreter is civulator/unit_model.py.
# The three rows marked "v0.7" are the old constants, exactly as they were applied:
# the archer penalty is shooter-only and by unit name, so the Slinger (a ranged
# unit by class) keeps getting none. The Crossbowman rows and the two
# heavy_cavalry rows are new in 0.8 (Civ 6: anti-cavalry +10 vs all cavalry;
# the Knight is a mounted target of the same shooters).
class_bonuses = [
    { unit = "anti_cavalry", target = "light_cavalry", amount = 10, strength = "combat" },   # v0.7: Spearman vs Horseman (#63)
    { unit = "melee", target = "anti_cavalry", amount = 5, strength = "combat" },            # v0.7: Warrior/Swordsman vs Spearman (#63)
    { unit = "Archer", target = "light_cavalry", amount = -5, strength = "ranged" },         # v0.7: archer_vs_horseman_penalty
    { unit = "anti_cavalry", target = "heavy_cavalry", amount = 10, strength = "combat" },
    { unit = "Archer", target = "heavy_cavalry", amount = -5, strength = "ranged" },
    { unit = "Crossbowman", target = "light_cavalry", amount = -5, strength = "ranged" },
    { unit = "Crossbowman", target = "heavy_cavalry", amount = -5, strength = "ranged" },
]
ranged_city_penalty = 17         # flat ranged-strength penalty vs cities (subtracted)
fortification_bonus = [3, 6]     # indexed by fortification level - 1 (level is 1 or 2)
# Health penalty: coefficient * (100 - hp) / 100. One value shared by melee
# (get_combat_strength) and ranged (get_ranged_strength) — do not fork it.
hp_penalty_coefficient = -10
# Damage(HP) = damage_base * e^(damage_exponent_coefficient * StrengthDifference)
#              * random(damage_roll_min, damage_roll_max)
damage_base = 30
damage_exponent_coefficient = 0.04
damage_roll_min = 0.8
damage_roll_max = 1.2
heal_fortified = 20              # HP healed per turn when fortified
heal_normal = 10                 # HP healed per turn otherwise
# Flanking (issue #59): strength bonus per adjacent tile around the DEFENDER
# that holds a combat-capable friendly unit of the striking unit's player.
# Civ 6 uses +2 per flanking unit and our strength scale is Civ 6's, so the
# value transfers directly. Set to 0 to disable flanking entirely — the rule
# then costs nothing, not even the adjacency scan. Since #116 P4 the rule is
# also gated behind culture, as Erik wanted (#41/#76): it applies only for a
# player who knows a civic whose effects say `enables = ["flanking"]`
# ([civics."Military Tradition"], Civ 6's own unlock).
#
# Lives in [combat], not [game], despite the issue's wording: combat modifiers
# are read by civulator/unit_model.py, which is the only interpreter of the
# combat tables (#64, CLAUDE.md canonical-systems table). A number in [game]
# would need a direct CFG read inside game/unit.py to reach the combat path.
flanking_bonus = 2
# Zone of control (issue #84). ZoC exists here ONLY to decide whether a city
# is under siege -- its movement effect (entering an enemy ZoC ends movement)
# is deliberately NOT implemented; see the CHANGELOG. A tile is under a
# player's ZoC when it is adjacent to one of that player's land military
# units and no river runs along the shared edge.
#
# Civ 6 projects ZoC from melee, anti-cavalry and mounted units but not from
# ranged ones, which is the default here. The flag exists because "by
# default" is the wording of the rule, not a fact about the engine.
zone_of_control_from_ranged = false

[city]
health = 200
defense_strength = 20

# --- City ranged attack (issue #84) ---
# Civ 6, City combat: "once a city has walls, it can make ranged attacks
# against enemy units using a City Ranged Strength stat". A garrison alone is
# not enough, which is what gives Walls a second, offensive reason to exist.
# The building named here is the one that unlocks the bombard; it must be a
# key of [buildings.*].
ranged_building = "Walls"
# The building that marks a player's capital (#88): GameEnvironment.create_city
# grants it to a player's first city, and a `city_yield` effect with
# `capital_only = true` (#116 P4) applies only in a city holding it -- gameplay
# never reads "capital", it reads this building. A key of [buildings.*].
capital_building = "Palace"
# Civ 6 derives City Ranged Strength from the strongest ranged unit the
# civilization has built. There is no tech tree here (#41/#76), so the value
# is the Ancient-era stand-in for that: [units.Archer] ranged_strength.
ranged_strength = 25
# Civ 6: the city's ranged strike has Range 2 and, unlike Civ 5, is subject
# to line-of-sight rules. Both are honoured -- the bombard uses the canonical
# hex distance and Map.check_line_of_sight (see the CHANGELOG for the source).
ranged_range = 2

# --- Repair (issue #84) ---
# Civ 6: a city heals 20 HP per turn unless it is under siege.
heal_per_turn = 20

# --- Culture (issue #87) ----------------------------------------------------
# culture(city) = base + per_pop * population + sum of each source's `culture`
# (sources: [buildings.*]). Values must be multiples of 0.1; the loader turns
# them into integer tenths.
[culture]
base = 1.0          # per city per turn (stand-in for the Civ 6 Palace)
per_pop = 0.3       # per citizen (community-reported Civ 6 game-file value)

# --- Science, gold, faith (issue #116 P1, docs/progression_design.md §2.1) ---
# Same shape as [culture]: a city yields base + per_pop * population of each,
# plus the `science` / `gold` / `faith` columns of its buildings and complete
# districts and its districts' adjacency. All read by civulator/unit_model.py
# only (exactly these two keys), stored as int tenths; consumed by
# civulator/game/yields.py city_yield. Rule change in v0.8.0 (CHANGELOG).
[science]
base = 0.0          # Civ 6: no per-city science
per_pop = 0.5       # Civ 6: each citizen +0.5 science

[gold]
base = 0.0          # citizens yield no gold (Civ 6); the Palace, districts
per_pop = 0.0       # and buildings do
# Unit upgrades (#116 P3; docs/progression_design.md §6.4): the gold price of
# GameEnvironment.upgrade_unit is upgrade_per_production * (target production
# cost - unit production cost) + upgrade_base, in whole gold. Civ 6 states no
# formula; this one reproduces its single data point (Slinger -> Archer = 60
# gold) and is the community's reading of the game files. Both whole numbers.
upgrade_per_production = 2
upgrade_base = 10
# Purchasing (#116 P5; docs/progression_design.md §7.3): a unit or building
# costs production_cost * purchase_multiplier of the resource, scaled by the
# `purchase_percent` effects in force for it (summed, applied once, floored
# at 0). Civ 6: gold is 4x production. A whole number.
purchase_multiplier = 4

[faith]
base = 0.0
per_pop = 0.0
# Civ 6: faith is 2x production (#116 P5). A whole number.
purchase_multiplier = 2

# --- Trade routes (#116 P5; docs/progression_design.md §7.4 and "v2 fixes") ----
# Read only by civulator/game/trade.py. A route runs from a city centre of its
# owner (the origin, where a Trader stood) to another city within `range` hexes
# (canonical wrap distance), lasts `duration_turns` of its owner's turns, and
# yields to the ORIGIN every turn: for the destination's centre and each of its
# complete specialty districts, that entry of [trade.domestic] (destination of
# the same owner) or [trade.international] (another owner's), plus every
# `route_yield` effect in force. The destination's owner gets nothing (Civ 6).
# Entries name a district or "City Center" (anything else raises); yields are
# whole points of science / culture / gold / faith / food / production. Civ 6
# Gathering Storm values (docs/civ6_progression_reference.md §10): land range
# 15, minimum duration 21 turns (no round trips, no era extension).
[trade]
unit = "Trader"     # the unit that makes a route (a [units.*] name)
range = 15
duration_turns = 21

[trade.domestic]
"City Center" = { food = 1, production = 1 }
Campus = { food = 1 }
"Holy Site" = { food = 1 }
"Theater Square" = { food = 1 }
"Entertainment Complex" = { food = 1 }
Encampment = { production = 1 }
"Industrial Zone" = { production = 1 }
"Commercial Hub" = { production = 1 }
Harbor = { production = 1 }
"Government Plaza" = { food = 1, production = 1 }

[trade.international]
"City Center" = { gold = 3 }
Campus = { science = 1 }
"Holy Site" = { faith = 1 }
"Theater Square" = { culture = 1 }
"Entertainment Complex" = { food = 1 }
Encampment = { production = 1 }
"Industrial Zone" = { production = 1 }
"Commercial Hub" = { gold = 3 }
Harbor = { gold = 3 }
"Government Plaza" = { gold = 2 }

# --- Housing (issue #88, docs/housing_design.md s1) -------------------------
# Water housing at the city centre (Civ 6 values) and the radius within which
# a city's owned improvements add housing. Read only by civulator/game/housing.py
# via unit_model. Other sources declare a `housing` column in their own table
# ([buildings.*], [improvements.*]). Values must be multiples of 0.1.
[housing]
water_fresh = 5
water_coastal = 3
water_dry = 2
improvement_radius = 3
# Growth slowdown (s2): [min, percent] of (housing - population); min is
# inclusive and a multiple of 0.1, percent an int; first match wins, no match
# = 0 % (hard cap). mins must be strictly descending. -4.9 encodes "> -5".
growth_bands = [ [2.0, 100], [1.0, 50], [-4.9, 25] ]

# --- Territory (issue #87, docs/borders_culture_design.md §2, §4, §5) --------
# Tiles are owned per city (Map.owner_city). Read only by
# civulator/game/territory.py.
[territory]
claim_radius = 5    # Civ 6: culture claims tiles up to 5 hexes from the centre
work_radius = 3     # Civ 6: cities work and buy tiles up to 3 hexes out (swap_tile reads it; assign_tiles widens to it in P4)
founding_ring = 1   # tiles claimed at founding

# Border growth cost (borders design §3.1): the n-th culture claim costs
# curve(n) culture points. `curve` keys BORDER_COST_CURVES in
# civulator/game/territory.py (unknown names raise); every other key is a
# parameter of that curve. civ6_community: a + (b*(n-1))**p, a community
# reading of Civ 6 (10, 20.3, 35.3, 52.8, ...).
[territory.border_cost]
curve = "civ6_community"
a = 10
b = 6
p = 1.3

# --- Loyalty (issue #116 P7, docs/progression_design.md §8 and "v2 fixes") ------
# Read only by civulator/game/loyalty.py. Every city has a loyalty 0..`maximum`
# (`founded` for a new city; `captured` for a city that changes hands, by
# capture or by a loyalty flip). All values are ints. Once per round, at round end, each city's
# loyalty moves by its delta, computed for every city from the state at the
# start of the phase (Civ 6's formula, in integers; the Civilization Wiki,
# docs/civ6_progression_reference.md §11):
#   pressure of player P on city C = sum over P's cities c within `range`
#       (canonical wrap distance, inclusive) of population(c) * (citizen_weight
#       - distance(c, C)); C counts for its owner at distance 0
#   own = the owner's pressure, foreign = every other living player's, summed
#   drift = sign(own - foreign) * (2 * drift_gain * |own - foreign|
#           // (2 * min(own, foreign) + 1)), clamped to +-drift_cap
#           (Civ 6: 10 * (D - F) / (min(D, F) + 0.5), capped at +-20)
#   delta = drift + `garrison` (a unit of the owner of a fighting class on the
#           centre) + the `loyalty` columns of the city's buildings and
#           complete districts + the `loyalty` effects in force for it
# A city at 0 after the phase flips to the player with the largest foreign
# pressure on it (ties: lower player index), if any player presses it.
# `bands` = [min loyalty, yield percent, growth share] rows, ints, mins
# strictly descending, first match wins, loyalty 0 falls into the last row:
# the percent scales science, culture, gold, faith and production; the share
# scales growth (food is not scaled). Civ 6's four bands.
[loyalty]
maximum = 100       # Civ 6: loyalty runs 0..100
founded = 100
captured = 50       # design §8.1, Claude's call: a conquest must be consolidated
range = 9           # Civ 6: only cities within 9 tiles press
citizen_weight = 10 # Civ 6: a citizen's pressure falls 10 % per tile (must exceed range)
drift_gain = 10
drift_cap = 20
garrison = 2        # design §8.2, Claude's call (Civ 6 has no inherent garrison term)
bands = [[76, 100, 100], [51, 75, 75], [26, 50, 25], [1, 0, 0]]

# --- Research: the tech tree (issue #116 P2, docs/progression_design.md §4) ---
# Read only by civulator/research_model.py. A tech is one [techs.*] table:
#   cost       Civ 6 base science (Standard speed), positive int
#   era        Ancient | Classical | Medieval | Renaissance
#   requires   tech names (absent = available from the start); every name
#              must exist, the graph must be acyclic and every tech reachable
#   effects    optional; interpreted by civulator/effects.py (#116 P4)
# Names, eras and costs are Civ 6 Gathering Storm's
# (docs/civ6_progression_reference.md §1); prerequisites are this design's,
# differing from Civ 6 only where a cut tech sat in between (design §4.2).
# What a tech unlocks is never declared here: it is the `requires_tech`
# column of the unlocked item's own table.
[research]
tech_cost_percent = 75   # every tech costs cost * this // 100 whole science (design §12)
civic_cost_percent = 75  # every civic costs cost * this // 100 whole culture (design §12)

[techs.Pottery]
