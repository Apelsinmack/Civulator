# Civulator — Game Configuration
# Hot-reloadable settings. Modify and restart training to apply.

[map]
rows = 24
columns = 48
type = "earthlike"       # "earthlike" (default, Duel-size minimum, E5) | "basic"
# Size preset (design doc D14/§6, §11 P5): GameEnvironment resolves this
# name through [map.sizes.*] below for rows/cols + a default player count
# whenever the caller doesn't pass explicit ones (explicit constructor args
# always override -- see civulator/game/environment.py:resolve_size_and_players).
# `rows`/`columns` above stay in place as the OLDER flat keys a few
# out-of-scope scripts still read directly; `size` is the new, single
# source of truth for the five run scripts P5 repoints (watch/train/
# train_shared/train_shared_large/replay) and for the engine itself.
size = "standard"
# Unseeded-reset resample policy (design doc D26, §11 P7.5): GameEnvironment
# .reset() WITHOUT an explicit seed catches StartPlacementError, logs a
# warning, and draws the next master seed from the engine's own RNG stream
# to try again, up to this many attempts total before raising. reset(seed=N)
# never resamples -- an explicit seed either works or fails loudly, always
# (reproducibility: no seed is silently swapped for a different world).
max_world_retries = 10

# =====================================================================
# Earthlike world generation (v0.6, docs/terrain_model_design.md §4.3/§4.4,
# §11 P3) — civulator/mapgen/earthlike.py DEFAULT_PARAMS mirrors every key
# below (config overrides those code defaults; civulator.mapgen itself
# never reads this file — Map.generate_map reads it once and passes the
# resolved dict down, design doc §4.1). Values not pinned by the design doc
# are this patch's own tuning, not claimed as "the" earthlike numbers — see
# the P3 implementation report for the reasoning behind each one.
# =====================================================================
[map.earthlike]
continent_wavelength = 3       # coarsest-octave period P_0 (m in P_k = m*2^k); "m ~ 3-4" per §4.3
octaves = "auto"                # "auto" -> clamp(round(log2(width)) - 2, 3, 9); or an explicit int
mountain_wavelength = 5         # orogeny-mask noise period
mountain_belt_percent = 0.35    # nearest-rank fraction of the map that is mountain-belt-eligible
# Split elevation (design doc D25, §4.3 amendment, §11 P7.5): E_sea =
# continentalness + mountain_amp_coast * orogeny_mask * ridged drives ONLY
# is_land/sea_level/water_base; E_relief = continentalness +
# mountain_amp_relief * orogeny_mask * ridged drives ONLY the mountain/hill
# relief cut (over E_sea's land) plus river junction altitudes and
# temperature's lapse term. mountain_amp_coast=0.0 degenerates E_sea to
# pure continentalness (measured: 3-5 round continents instead of 24-79
# fragments); set it > 0.0 to restore the pre-D25 single-field behavior of
# mountains also reshaping the coastline itself. mountain_amp_relief=1.5 is
# the ORIGINAL single-field mountain_amp value, unchanged.
mountain_amp_coast = 0.0
mountain_amp_relief = 1.5
warp_amp = 4.0                  # domain-warp displacement, in hex-center units
warp_octaves = 3
# D25: 0.35 -> 0.45, measured (P6 sweep, reconfirmed on the shipped P7.5
# split-elevation code, see the P7.5 report's sweep table) to cut start-
# placement failure from 27.7% to ~2% -- only effective paired with the
# mountain_amp split above (see mountain_amp_coast's comment).
land_percent = 0.45             # whole-map nearest-rank fraction that becomes land (sea level)
mountain_percent = 0.08         # fraction OF LAND that becomes mountain relief
hill_percent = 0.20             # fraction OF LAND that becomes hill relief (cumulative with mountain)
smooth_iterations = 3           # talus-smoothing Jacobi iteration count (design doc §4.2 rule 5)
talus_slope = 0.08              # max elevation delta between neighbors before diffusion
diffusion_coeff = 0.4           # fraction of excess slope that diffuses per talus iteration
lake_max_size = 12              # connected water components <= this many tiles become Lake
temp_wobble_amp = 0.3           # coherent temperature-band-boundary wobble amplitude
temp_wobble_wavelength = 4
temp_lapse_rate = 0.8           # temperature lost per unit elevation above sea level
temp_snow_percentile = 0.25     # PW3 starting number (§4.4): coldest 25% of land -> Snow
temp_tundra_percentile = 0.30   # next up to 30th percentile -> Tundra
moisture_wavelength = 5
moisture_octaves = 4
moisture_desert_percentile = 0.36  # PW3 starting number (§4.4): driest 36% of (warm) land -> Desert
moisture_plains_percentile = 0.56  # next up to 56th percentile -> Plains; rest -> Grassland

# --- Rivers (v0.6, design doc §5, §11 P4) — civulator/mapgen/rivers.py ---
river_percent = 0.18               # nearest-rank UPSTREAM FLUX quantile that becomes river (§5: "~0.15-0.20")
river_moisture_bonus = 0.1         # added to moisture where river-adjacent, before biome classification
river_min_length = 2               # rivers (connected junction-edge components) shorter than this are dropped
river_pd_epsilon = 0.0001          # ε: Planchon-Darboux sink-fill step (design doc §4.2 rule 5) — ε >> jitter
river_altitude_jitter = 0.0000001  # δ: per-junction altitude jitter magnitude, δ << ε (breaks exact ties)

[map.earthlike.feature_chance]
# Per-tile hash-roll probability (design doc §4.2 rule 3), applied only to
# tiles that already pass BOTH the structural `on` gate and this stage's
# eligibility gate (civulator/mapgen/features.py). Woods/rainforest/marsh/
# ice/reef gate on climate bands (temp_rank/moisture_rank); oasis (§5) gates
# on its own river/water/neighbor-Oasis eligibility instead — its number
# here is the roll probability on already-ELIGIBLE tiles, not a fraction of
# all land (design doc §5's "~1% of land" describes the resulting COUNT).
woods = 0.35
rainforest = 0.50
marsh = 0.15
ice = 0.70
reef = 0.30
oasis = 0.20

# =====================================================================
# Map size presets (design doc §6, D14): rows/cols (never W x H — kills the
# transposition ambiguity) + default/max players. GameEnvironment preset
# RESOLUTION (selecting a size by name) is P5 scope; the mapgen preview CLI
# (`python -m civulator.mapgen --size NAME`) already resolves through this
# table (civulator/mapgen/data.py:resolve_size).
# =====================================================================
[map.sizes.duel]
rows = 12
cols = 24
default_players = 2
max_players = 3

[map.sizes.tiny]
rows = 16
cols = 32
default_players = 3
max_players = 4

[map.sizes.small]
rows = 20
cols = 40
default_players = 4
max_players = 6

[map.sizes.standard]
rows = 24
cols = 48
default_players = 6
max_players = 8

[map.sizes.large]
rows = 32
cols = 64
default_players = 8
max_players = 12

[map.sizes.huge]
rows = 42
cols = 84
default_players = 12
max_players = 16

[map.sizes.colossal]
rows = 66
cols = 106
default_players = 12
max_players = 24

# =====================================================================
# Starting locations (design doc §6, D13, §11 P5) -- civulator/mapgen/starts.py
# DEFAULT_PARAMS mirrors every key below (config overrides those code
# defaults; mapgen itself never reads this file -- Map.generate_map reads it
# once and passes the resolved dict down as params["starts"], same "read
# config once at the call boundary" contract as [map.earthlike]).
# =====================================================================
[map.starts]
# --- Fertility weights (§6.1) -- kept DYADIC (powers of two / halves) so
# candidate score sums are exact and order-independent (design doc §4.2
# rule 6). A typical candidate's ring 0-2 yield-only score lands roughly in
# the 15-35 range (most base terrains sum to 0-2 food+production; ~18
# ring-1/ring-2 tiles contribute) -- fresh_water_weight is chosen to be a
# strong differentiator at that scale without dominating it outright.
ring2_weight = 0.5          # design doc §6.1: "ring 2 at half weight"
fresh_water_weight = 8.0    # "heavily weighted" -- dyadic (2**3)
coastal_weight = 4.0        # "half of that" -- exactly fresh_water_weight / 2 (2**2)
min_passable_ring1 = 3      # REJECT candidates with fewer passable ring-1 tiles (§6.1)

# --- Placement (§6.3) ---
d_min_players_factor = 3.5  # d_min = round(sqrt(tiles / (players * this)))
d_min_floor = 4             # floor for BOTH the raw formula and the relax-and-retry ladder.
                            # Tracks [game] min_city_distance (#74): every start becomes a
                            # capital, so the floor must never allow capitals closer than
                            # the found-city rule permits. Mirrored in mapgen/starts.py.

# --- Normalization thresholds (§6.4) -- scaled from Civ 6's own (food<7/
# best<3, prod<5/best<2, both "over 6 tiles" i.e. the ring-1 neighborhood)
# to OUR yield scale. Derivation (P5 implementation report has the full
# walkthrough): our average per-BASE-terrain yield across the 8 entries in
# [terrain.base.*] (5 land + 3 water -- a ring-1 tile can legitimately be
# either) is food=1.0, production=0.125. Civ6's thresholds imply a per-tile
# baseline of food=7/6, production=5/6 (its own totals spread over the same
# 6-tile ring). scale = our_avg / civ6_avg_per_tile:
#   food_scale = 1.0 / (7/6) = 6/7          prod_scale = 0.125 / (5/6) = 0.15
#   food_total_min = 7 * food_scale = 6.0    (this always reduces to
#                                              exactly 6 * our_avg_food --
#                                              the Civ6 "7" cancels out)
#   food_best_min  = 3 * food_scale = 18/7 ~= 2.5714
#   prod_total_min = 5 * prod_scale = 0.75   (= 6 * our_avg_production)
#   prod_best_min  = 2 * prod_scale = 0.30
# Production ends up scarce here (as in Civ6, most production comes from
# hills/woods/resources, not base terrain), so prod_total_min/prod_best_min
# are small: a ring-1 with even ONE hill nearby already clears them, and
# they only bind when literally zero ring-1 tiles carry any production.
food_total_min = 6.0
food_best_min = 2.5714285714285716   # 18/7 exactly
prod_total_min = 0.75
prod_best_min = 0.3

# --- "basic" generator (design doc §4.1, §11 P3): iid per-tile terrain, the
# deliberately simple option — same weight table pre-0.6 had, now consumed
# by civulator/mapgen/basic.py instead of the deleted engine-level shim. ---
[map.terrain_weights]
# Relative weights for terrain generation (will be normalized)
Plains = 0.30
Grassland = 0.30
Desert = 0.10
Tundra = 0.10
Hills = 0.10
Woods = 0.05
Mountain = 0.05

[map.features]
# Probability of adding features to eligible terrain
woods_chance = 0.2       # Plains, Grassland, Tundra
rainforest_chance = 0.1  # Plains, Grassland

# =====================================================================
# Composable terrain model (v0.6, docs/terrain_model_design.md §3.1) — ADDITIVE.
# Every gameplay number a tile has is the SUM of its layers' contributions
# (base x relief x feature x resource), interpreted by civulator.terrain_model
# and read by the engine through Tile's composed properties. Line of sight is
# `los = [obstacle, vantage]`: you see distance 2 + vantage, and an obstacle
# blocks when its level exceeds the observer's vantage.
#
# P2a removed the legacy [terrain.movement_costs] / [terrain.defense_modifiers] /
# [terrain.los] tables (and the Terrain class that merged them) — this schema is
# now the only source. [map.terrain_weights] / [map.features] above still feed
# the interim world-gen shim in Map.generate_map; patch P3 replaces both with
# the mapgen package.
# =====================================================================

# --- Base terrains: land ---
[terrain.base.Grassland]
yields = [2, 0]
movement = 1
defense = 0
los = [0, 0]
domain = "land"

[terrain.base.Plains]
yields = [1, 1]
movement = 1
defense = 0
los = [0, 0]
domain = "land"

[terrain.base.Desert]
yields = [0, 0]
movement = 1
defense = 0
los = [0, 0]
domain = "land"

[terrain.base.Tundra]
yields = [1, 0]
movement = 1
defense = 0
los = [0, 0]
domain = "land"

[terrain.base.Snow]
yields = [0, 0]
movement = 1
defense = 0
los = [0, 0]
domain = "land"

# --- Base terrains: water ---
[terrain.base.Coast]
yields = [1, 0]
movement = 1
defense = 0
los = [0, 0]
domain = "water"

[terrain.base.Lake]
yields = [2, 0]
movement = 1
defense = 0
los = [0, 0]
domain = "water"

[terrain.base.Ocean]
yields = [1, 0]
movement = 1
defense = 0
los = [0, 0]
domain = "water"

# --- Relief (land only; water is always flat, §3) ---
[terrain.relief.flat]
yields = [0, 0]
movement = 0
defense = 0
los = [0, 0]

[terrain.relief.hills]
yields = [0, 1]
movement = 1             # additive: Grassland + hills costs 2
defense = 3
los = [1, 1]

[terrain.relief.mountain]
yields = [0, 0]
movement = 0              # blocking comes from `impassable`, not a cost sentinel (D6)
defense = 0
los = [3, 0]
impassable = true

# --- Features (<=1 per tile) ---
[terrain.feature.Woods]
yields = [0, 1]
movement = 1
defense = 3
los = [1, 0]
on = { bases = ["Plains", "Grassland", "Tundra"], relief = ["flat", "hills"] }

[terrain.feature.Rainforest]
yields = [1, 0]
movement = 1
defense = 3
los = [1, 0]
on = { bases = ["Plains"], relief = ["flat", "hills"] }

[terrain.feature.Marsh]
yields = [1, 0]
movement = 1
defense = -2
los = [0, 0]
on = { bases = ["Grassland"], relief = ["flat"] }

[terrain.feature.Floodplains]
yields = [3, 0]
movement = 0
defense = -2
los = [0, 0]
on = { bases = ["Desert"], relief = ["flat"] }
# "along rivers" (§3) is a river-edge/adjacency condition, out of scope for
# this per-tile base/relief/feature evaluator — enforced at generation time
# (mapgen, patch P4), not here.

[terrain.feature.Oasis]
yields = [3, 0]
movement = 0
defense = 0
los = [0, 0]
on = { bases = ["Desert"], relief = ["flat"] }
# "no river on-tile, no adjacent water/Oasis/Floodplains" (§3) is likewise a
# spatial condition enforced by the generator (P4), not by this evaluator.

[terrain.feature.Reef]
yields = [1, 1]
movement = 0
defense = 0
los = [0, 0]
on = { bases = ["Coast"] }

[terrain.feature.Ice]
yields = [0, 0]
movement = 0
defense = 0
los = [0, 0]
on = { bases = ["Coast", "Ocean"] }
# "polar" (§3) is a latitude condition, enforced by the generator (P3/P4).

# --- Resources (bonus tier, §3.2; luxury/strategic ship schema-ready via `class`) ---
# `chance` (added P4, design doc §11 P4 deliverable 5): per-tile hash-roll
# probability (design doc §4.2 rule 3), applied only to tiles that already
# pass this resource's `on` constraint AND don't already carry a resource —
# civulator/mapgen/resources.py. Tuned so a Standard-size (48x24) earthlike
# world carries roughly 15-30 total bonus resources across all 8 kinds
# combined (see the P4 implementation report for the seed sweep this was
# tuned against) — NOT independently "the" rate for any one resource.
[terrain.resource.Wheat]
class = "bonus"
yields = [1, 0]
chance = 0.05
# Civ 6: Wheat sits on flat Plains, or on Desert Floodplains. The single
# AND-of-ORs mapping the design doc sketched (bases=["Plains"],
# features=["none","Floodplains"]) is unsatisfiable on its Floodplains branch —
# Floodplains only exist on Desert — so this uses the list-of-mappings form.
on = [
    { bases = ["Plains"], relief = ["flat"], features = ["none"] },
    { bases = ["Desert"], relief = ["flat"], features = ["Floodplains"] },
]

[terrain.resource.Rice]
class = "bonus"
yields = [1, 0]
chance = 0.04
on = { bases = ["Grassland"], relief = ["flat"], features = ["none", "Marsh"] }

[terrain.resource.Cattle]
class = "bonus"
yields = [1, 0]
chance = 0.04
on = { bases = ["Grassland"], relief = ["flat"], features = ["none"] }

[terrain.resource.Sheep]
class = "bonus"
yields = [0, 1]
chance = 0.04
on = { relief = ["hills"], features = ["none"] }

[terrain.resource.Stone]
class = "bonus"
yields = [0, 1]
chance = 0.04
on = { bases = ["Grassland"], relief = ["flat", "hills"], features = ["none"] }

[terrain.resource.Deer]
class = "bonus"
yields = [0, 1]
chance = 0.04
# "Woods or Tundra" (§3.2) is a disjunction across dimensions that a single
# AND-of-ORs mapping cannot express — `on` as a list of mappings means valid
# if ANY one matches (civulator/terrain_model.py check_on/_match).
on = [
    { features = ["Woods"] },
    { bases = ["Tundra"] },
]

[terrain.resource.Bananas]
class = "bonus"
yields = [1, 0]
chance = 0.35
on = { features = ["Rainforest"] }

[terrain.resource.Fish]
class = "bonus"
yields = [1, 0]
chance = 0.008
on = { bases = ["Coast", "Lake"] }

[terrain.river]
crossing_cost = 1

# --- Improvements (§3.1: the same `on` formalism as terrain layers) ---
# Consumed by GameEnvironment.can_build_improvement_at / build_improvement.
# These mirror the hardcoded terrain lists P2a replaced: the legacy flat
# terrain names "Hills" and "Floodplains" become a relief and a feature
# constraint, and features were never checked (a Woods Plains tile always
# allowed a Farm), so only the mappings below constrain them.
# An improvement without an `on` key is buildable nowhere.
#
# Columns (#116 P2, docs/progression_design.md "v2 fixes"), all optional and
# read only by civulator/terrain_model.py:
#   requires_tech   a [techs.*] name; absent = buildable from the start
#   food, production, gold
#                   whole points per turn the improvement adds to its tile
#                   (default 0): food and production through Tile.yields,
#                   gold through city_yield(city, "gold") over worked tiles.
#                   Civ 6 Gathering Storm base yields, before any tech or
#                   policy bonus (those are not modelled). Rule change v0.8.0.
# The Oil Well is removed (v0.8.0): no tech in this span unlocks it.

[improvements.Farm]
housing = 0.5      # optional column (default 0); Civ 6. A multiple of 0.1
food = 1           # Civ 6 GS: +1 Food (wiki Farm_(Civ6))
on = [
    { bases = ["Plains", "Grassland", "Desert"], relief = ["flat"] },
    { features = ["Floodplains"] },
]

[improvements.Mine]
requires_tech = "Mining"
production = 1     # Civ 6 GS: +1 Production (wiki Mine_(Civ6))
on = [
    { relief = ["hills"] },
    { bases = ["Desert", "Tundra", "Snow"], relief = ["flat"] },
]

[improvements.Plantation]
requires_tech = "Irrigation"
housing = 0.5
gold = 2           # Civ 6 GS: +2 Gold (wiki Plantation_(Civ6))
on = { bases = ["Plains", "Grassland", "Desert"], relief = ["flat"] }

[improvements.Camp]
requires_tech = "Animal Husbandry"
housing = 0.5
gold = 2           # Civ 6: +1 Gold, GS +2 Gold (wiki Camp_(Civ6))
on = { bases = ["Plains", "Grassland", "Tundra", "Desert"], relief = ["flat"] }

[improvements.Pasture]
requires_tech = "Animal Husbandry"
housing = 0.5
production = 1     # Civ 6 GS: +1 Production (wiki Pasture_(Civ6))
on = { bases = ["Plains", "Grassland", "Desert", "Tundra"], relief = ["flat"] }

[improvements.Quarry]
requires_tech = "Mining"
production = 1     # Civ 6 GS: +1 Production (wiki Quarry_(Civ6))
on = { bases = ["Plains", "Desert", "Grassland", "Tundra"], relief = ["flat"] }

# Civ 6 unlocks Fishing Boats with Sailing, which this tree cuts (design §4.2).
[improvements."Fishing Boats"]
requires_tech = "Celestial Navigation"
housing = 0.5
food = 1           # Civ 6 GS: +1 Food (wiki Fishing_Boats_(Civ6))
on = { bases = ["Coast", "Lake"] }

[game]
num_players = 8
max_turns = 1000
starting_warriors = 3
min_city_distance = 4    # Minimum hex distance (steps) between city CENTRES.
                         # can_found_city_at rejects distance < this, so founding is
                         # legal from `this` steps out: 4 leaves 3 tiles between
                         # centres. Counted centre-to-centre, not border-to-border
                         # (#74). Read only via environment.MIN_CITY_DISTANCE.
city_score_weight = 10   # Turn-cap tiebreak: score = cities * this + units (#55)

# =====================================================================
# Unit stat tables and combat formula constants (issue #64) — moved out of
# civulator/game/unit.py so a future balance change is a config edit,
# measurable against a baseline that differs by nothing else. The only
# interpreter of these tables is civulator/unit_model.py (never read
# [units.*] / [combat] from CFG directly — see CLAUDE.md's canonical-systems
# table). tests/test_unit_config_identity.py pins today's numbers as
# hardcoded literals so this move itself changes nothing.
#
# NUM_UNIT_SLOTS/UNIT_SLOT and MOVEMENT_DOMAIN stay in civulator/game/unit.py
# (not here) — see the comments on those tables for why.
# =====================================================================
[units.Warrior]
max_movement = 2
combat_strength = 20
ranged_strength = 0
range = 1
production_cost = 40

# Slinger: the Civ 6 Ancient-era ranged starter (issue #67). Range 1 —
# it shoots only into adjacent tiles, unlike the Archer's 2. Ungated, with
# the Warrior: the opening web (#116 P2).
#
# requires_tech (#116 P2, optional): the [techs.*] name a player must know
# before any city may build the unit; absent = buildable from the start.
# Read only by civulator/unit_model.py; checked through
# civulator/game/availability.py player_can_build.
[units.Slinger]
max_movement = 2
combat_strength = 5
ranged_strength = 15
range = 1
production_cost = 35

[units.Archer]
requires_tech = "Archery"
max_movement = 2
combat_strength = 15
ranged_strength = 25
range = 2
production_cost = 60

[units.Swordsman]
requires_tech = "Iron Working"
max_movement = 2
combat_strength = 35
ranged_strength = 0
range = 1
production_cost = 90

[units.Spearman]
requires_tech = "Bronze Working"
max_movement = 2
combat_strength = 25
ranged_strength = 0
range = 1
production_cost = 65

[units.Horseman]
requires_tech = "Horseback Riding"
max_movement = 4
combat_strength = 35
ranged_strength = 0
range = 1
production_cost = 80

[units.Settler]
max_movement = 2
combat_strength = 0
ranged_strength = 0
range = 0
production_cost = 120

[units.Worker]
max_movement = 2
combat_strength = 0
ranged_strength = 0
range = 0
production_cost = 50

[units.Catapult]
requires_tech = "Engineering"
max_movement = 2
combat_strength = 23
ranged_strength = 35
range = 2
production_cost = 120
# siege_class (issue #66): exempt from [combat] ranged_city_penalty. Breaking
# fortifications is the siege class's entire identity in Civ 6, and the flat
# penalty was being applied to the one class Civ 6 exempts. Optional key,
# absent = false; the only interpreter is civulator/unit_model.py.
siege_class = true

# --- Siege support (issue #66) ----------------------------------------------
# Stats only. Both units have occupied UNIT_SLOT 2 since the stacking design
# landed, with no numbers anywhere else — names with a slot and nothing else.
# Civ 6 support units carry combat strength 0 (they are escorted, not fought
# with) and are the reason the siege support slot exists.
#
# Their Civ 6 mechanic — an adjacency that changes how ANOTHER unit's attack
# resolves against a city's walls — is deliberately NOT implemented; see the
# CHANGELOG. They are therefore in game/unit.py's DEFERRED_BUILD_UNITS and not
# in BUILD_OPTIONS: offering an agent a unit that does nothing would be a build
# option that cannot pay off.
[units.BatteringRam]
requires_tech = "Masonry"
max_movement = 2
combat_strength = 0
ranged_strength = 0
range = 0
production_cost = 65

[units.SiegeTower]
requires_tech = "Machinery"
max_movement = 2
combat_strength = 0
ranged_strength = 0
range = 0
production_cost = 100

# --- Combat formula constants (Civ6-inspired modifier stacking, #60/#63) ---
[combat]
anti_cavalry_bonus = 10          # Spearman vs Horseman, both directions (#63)
melee_vs_spearman_bonus = 5      # Warrior/Swordsman vs Spearman, both directions (#63)
ranged_city_penalty = 17         # flat ranged-strength penalty vs cities (subtracted)
archer_vs_horseman_penalty = 5   # Archers less effective vs cavalry (subtracted)
fortification_bonus = [3, 6]     # indexed by fortification level - 1 (level is 1 or 2)
# Health penalty: coefficient * (100 - hp) / 100. One value shared by melee
# (get_combat_strength) and ranged (get_ranged_strength) — do not fork it.
hp_penalty_coefficient = -10
# Damage(HP) = damage_base * e^(damage_exponent_coefficient * StrengthDifference)
#              * random(damage_roll_min, damage_roll_max)
damage_base = 30
damage_exponent_coefficient = 0.04
damage_roll_min = 0.8
damage_roll_max = 1.2
heal_fortified = 20              # HP healed per turn when fortified
heal_normal = 10                 # HP healed per turn otherwise
# Flanking (issue #59): strength bonus per adjacent tile around the DEFENDER
# that holds a combat-capable friendly unit of the striking unit's player.
# Civ 6 uses +2 per flanking unit and our strength scale is Civ 6's, so the
# value transfers directly. Set to 0 to disable flanking entirely — the rule
# then costs nothing, not even the adjacency scan. Erik wants this gated
# behind tech/culture eventually (#41/#76); a config value is the minimum
# version of that gate and keeps this epoch's behaviour reproducible.
#
# Lives in [combat], not [game], despite the issue's wording: combat modifiers
# are read by civulator/unit_model.py, which is the only interpreter of the
# combat tables (#64, CLAUDE.md canonical-systems table). A number in [game]
# would need a direct CFG read inside game/unit.py to reach the combat path.
flanking_bonus = 2
# Zone of control (issue #84). ZoC exists here ONLY to decide whether a city
# is under siege -- its movement effect (entering an enemy ZoC ends movement)
# is deliberately NOT implemented; see the CHANGELOG. A tile is under a
# player's ZoC when it is adjacent to one of that player's land military
# units and no river runs along the shared edge.
#
# Civ 6 projects ZoC from melee, anti-cavalry and mounted units but not from
# ranged ones, which is the default here. The flag exists because "by
# default" is the wording of the rule, not a fact about the engine.
zone_of_control_from_ranged = false

[city]
health = 200
defense_strength = 20

# --- City ranged attack (issue #84) ---
# Civ 6, City combat: "once a city has walls, it can make ranged attacks
# against enemy units using a City Ranged Strength stat". A garrison alone is
# not enough, which is what gives Walls a second, offensive reason to exist.
# The building named here is the one that unlocks the bombard; it must be a
# key of [buildings.*].
ranged_building = "Walls"
# Civ 6 derives City Ranged Strength from the strongest ranged unit the
# civilization has built. There is no tech tree here (#41/#76), so the value
# is the Ancient-era stand-in for that: [units.Archer] ranged_strength.
ranged_strength = 25
# Civ 6: the city's ranged strike has Range 2 and, unlike Civ 5, is subject
# to line-of-sight rules. Both are honoured -- the bombard uses the canonical
# hex distance and Map.check_line_of_sight (see the CHANGELOG for the source).
ranged_range = 2

# --- Repair (issue #84) ---
# Civ 6: a city heals 20 HP per turn unless it is under siege.
heal_per_turn = 20

# --- Culture (issue #87) ----------------------------------------------------
# culture(city) = base + per_pop * population + sum of each source's `culture`
# (sources: [buildings.*]). Values must be multiples of 0.1; the loader turns
# them into integer tenths.
[culture]
base = 1.0          # per city per turn (stand-in for the Civ 6 Palace)
per_pop = 0.3       # per citizen (community-reported Civ 6 game-file value)

# --- Science, gold, faith (issue #116 P1, docs/progression_design.md §2.1) ---
# Same shape as [culture]: a city yields base + per_pop * population of each,
# plus the `science` / `gold` / `faith` columns of its buildings and complete
# districts and its districts' adjacency. All read by civulator/unit_model.py
# only (exactly these two keys), stored as int tenths; consumed by
# civulator/game/yields.py city_yield. Rule change in v0.8.0 (CHANGELOG).
[science]
base = 0.0          # Civ 6: no per-city science
per_pop = 0.5       # Civ 6: each citizen +0.5 science

[gold]
base = 0.0          # citizens yield no gold (Civ 6); the Palace, districts
per_pop = 0.0       # and buildings do

[faith]
base = 0.0
per_pop = 0.0

# --- Housing (issue #88, docs/housing_design.md s1) -------------------------
# Water housing at the city centre (Civ 6 values) and the radius within which
# a city's owned improvements add housing. Read only by civulator/game/housing.py
# via unit_model. Other sources declare a `housing` column in their own table
# ([buildings.*], [improvements.*]). Values must be multiples of 0.1.
[housing]
water_fresh = 5
water_coastal = 3
water_dry = 2
improvement_radius = 3
# Growth slowdown (s2): [min, percent] of (housing - population); min is
# inclusive and a multiple of 0.1, percent an int; first match wins, no match
# = 0 % (hard cap). mins must be strictly descending. -4.9 encodes "> -5".
growth_bands = [ [2.0, 100], [1.0, 50], [-4.9, 25] ]

# --- Territory (issue #87, docs/borders_culture_design.md §2, §4, §5) --------
# Tiles are owned per city (Map.owner_city). Read only by
# civulator/game/territory.py.
[territory]
claim_radius = 5    # Civ 6: culture claims tiles up to 5 hexes from the centre
work_radius = 3     # Civ 6: cities work and buy tiles up to 3 hexes out (swap_tile reads it; assign_tiles widens to it in P4)
founding_ring = 1   # tiles claimed at founding

# Border growth cost (borders design §3.1): the n-th culture claim costs
# curve(n) culture points. `curve` keys BORDER_COST_CURVES in
# civulator/game/territory.py (unknown names raise); every other key is a
# parameter of that curve. civ6_community: a + (b*(n-1))**p, a community
# reading of Civ 6 (10, 20.3, 35.3, 52.8, ...).
[territory.border_cost]
curve = "civ6_community"
a = 10
b = 6
p = 1.3

# --- Research: the tech tree (issue #116 P2, docs/progression_design.md §4) ---
# Read only by civulator/research_model.py. A tech is one [techs.*] table:
#   cost       Civ 6 base science (Standard speed), positive int
#   era        Ancient | Classical | Medieval | Renaissance
#   requires   tech names (absent = available from the start); every name
#              must exist, the graph must be acyclic and every tech reachable
#   effects    optional, kept raw for #116 P4's effects interpreter
# Names, eras and costs are Civ 6 Gathering Storm's
# (docs/civ6_progression_reference.md §1); prerequisites are this design's,
# differing from Civ 6 only where a cut tech sat in between (design §4.2).
# What a tech unlocks is never declared here: it is the `requires_tech`
# column of the unlocked item's own table.
[research]
tech_cost_percent = 75   # every tech costs cost * this // 100 whole science (design §12)

[techs.Pottery]
cost = 25
era = "Ancient"

[techs."Animal Husbandry"]
cost = 25
era = "Ancient"

[techs.Mining]
cost = 25
era = "Ancient"

[techs.Astrology]
cost = 50
era = "Ancient"

[techs.Irrigation]
cost = 50
era = "Ancient"
requires = ["Pottery"]

[techs.Writing]
cost = 50
era = "Ancient"
requires = ["Pottery"]

[techs.Archery]
cost = 50
era = "Ancient"
requires = ["Animal Husbandry"]

[techs.Masonry]
cost = 80
era = "Ancient"
requires = ["Mining"]

[techs."Bronze Working"]
cost = 80
era = "Ancient"
requires = ["Mining"]

[techs."Celestial Navigation"]
cost = 120
era = "Classical"
requires = ["Astrology"]  # Civ 6 also requires Sailing (cut)

[techs.Currency]
cost = 120
era = "Classical"
requires = ["Writing"]

[techs."Horseback Riding"]
cost = 120
era = "Classical"
requires = ["Archery"]

[techs."Iron Working"]
cost = 120
era = "Classical"
requires = ["Bronze Working"]

[techs.Engineering]
cost = 200
era = "Classical"
requires = ["Masonry"]  # Civ 6: Wheel (cut)

[techs."Military Tactics"]
cost = 300
era = "Medieval"
requires = ["Bronze Working", "Currency"]  # Civ 6: Mathematics (cut)

[techs.Apprenticeship]
cost = 300
era = "Medieval"
requires = ["Currency", "Horseback Riding"]

[techs.Machinery]
cost = 300
era = "Medieval"
requires = ["Iron Working", "Engineering"]

[techs.Education]
cost = 335
era = "Medieval"
requires = ["Apprenticeship"]  # Civ 6: + Mathematics (cut); per-tech page cost 335

[techs."Military Engineering"]
cost = 335
era = "Medieval"
requires = ["Engineering"]  # Civ 6: Construction (cut); per-tech page cost 335

[techs.Stirrups]
cost = 390
era = "Medieval"
requires = ["Horseback Riding", "Apprenticeship"]

[techs.Castles]
cost = 390
era = "Medieval"
requires = ["Military Engineering"]  # Civ 6: Construction (cut)

[techs.Gunpowder]
cost = 600
era = "Renaissance"
requires = ["Apprenticeship", "Stirrups", "Military Engineering"]

# --- Buildings (issue #7) ---------------------------------------------------
# One table per building: `production_cost` is what a city pays for it, and
# `defense_bonus` (optional, default 0) is added to the city's defensive combat
# strength for as long as it stands. Read only by civulator/unit_model.py;
# City.BUILDING_COSTS and City.get_combat_strength are aliases of what it
# interprets, never a second copy of these numbers.
# Yield columns (optional, default 0, multiples of 0.1; #87 culture, #116 the
# rest): `science`, `culture`, `gold`, `faith` per turn into the owner's pools,
# `food` and `production` per turn into the city's own — all read by
# civulator/game/yields.py city_yield, never by name.
# Availability columns (#116 P2, all optional; checked by
# civulator/game/availability.py city_can_build_building, the one predicate
# production, the build mask and purchasing call):
#   requires_tech      a [techs.*] name the owner must know
#   requires_district  a [districts.*] name: a COMPLETE district of that type
#                      must stand in the city
#   requires_building  a [buildings.*] name the city must already own
#   requires_civic, requires_government_tier
#                      accepted for #116 P4 (civics, governments); they pass
#                      until P4 defines what they name
#   maintenance        gold per turn (multiple of 0.1, default 0); parsed and
#                      stored now, deducted from #116 P5 on
# Civ 6 Gathering Storm values (docs/civ6_progression_reference.md §7);
# design: docs/progression_design.md §6.2. The Factory is removed (v0.8.0):
# it is beyond the tree (Industrialization).
[buildings.Granary]
production_cost = 60
requires_tech = "Pottery"
housing = 2         # optional column (default 0); Civ 6 Granary. A multiple of 0.1
food = 1            # rule change v0.8.0 (#116 P1): Civ 6 Granary +1 Food
                    # (docs/civ6_progression_reference.md §7)

[buildings.Monument]
production_cost = 50
culture = 2         # optional column (default 0); Civ 6 Monument. A multiple of 0.1

# Walls: +30 defence, Civ 6's Ancient Walls (see CHANGELOG). The building
# that unlocks the city's ranged strike ([city] ranged_building).
[buildings.Walls]
production_cost = 100
requires_tech = "Masonry"
defense_bonus = 30

# Workshop: Civ 6's cost and yield (v0.8.0; it was 120 and inert).
[buildings.Workshop]
production_cost = 195
requires_tech = "Apprenticeship"
requires_district = "Industrial Zone"
production = 3
maintenance = 1

[buildings.Library]
production_cost = 90
requires_tech = "Writing"
requires_district = "Campus"
science = 2
maintenance = 1

[buildings.University]
production_cost = 250
requires_tech = "Education"
requires_district = "Campus"
requires_building = "Library"
science = 4
housing = 1
maintenance = 2

[buildings.Shrine]
production_cost = 70
requires_tech = "Astrology"
requires_district = "Holy Site"
faith = 2
maintenance = 1

[buildings.Barracks]
production_cost = 90
requires_tech = "Bronze Working"
requires_district = "Encampment"
production = 1
housing = 1
maintenance = 1

# Medieval Walls: a second +30 on top of the Walls (Civ 6: +100 outer
# defence each); no maintenance (Civ 6).
[buildings."Medieval Walls"]
production_cost = 220
requires_tech = "Castles"
requires_building = "Walls"
defense_bonus = 30

# Palace (#88): granted to a player's first city by GameEnvironment.create_city,
# never built (no production_cost, so City.produce_building refuses it).
[buildings.Palace]
housing = 1
# Rule change v0.8.0 (#116 P1): the Civ 6 Palace's yields, +2 Science, +5 Gold,
# +2 Production (docs/civ6_progression_reference.md §7). Its +1 Culture stays
# in [culture] base, which every city already gets (design §0.3).
science = 2
gold = 5
production = 2

# --- Districts (issue #86, docs/districts_design.md) ------------------------
# Civ 6 Gathering Storm values. Read only by civulator/district_model.py.
# Scalars first; every sub-table is one district (names with spaces quoted;
# "City Center" and "any" are reserved). Per district:
#   production_cost      base cost (positive int)
#   cost_model           "discounted" | "progress" | "fixed" (design §4)
#   discount_percent     int, for "discounted"
#   counts_toward_limit  takes a population slot (default true)
#   max_per_city         default 1;  max_per_player: absent = unlimited
#   adjacency_yield      what the adjacency score becomes (§5): culture,
#                        production, science, gold, faith or none (default)
#   adjacency            rows { amount, per (default 1), <one source> } (§1.2);
#                        each row floored separately: floor(count/per)*amount
#   on                   terrain mapping for the district's own tile; absent = land
#   adjacent_to_city_center   true = required, false = forbidden, absent = either
#   requires_adjacent    sources of which at least one must hold (§2)
#   science, culture, gold, faith, food, production
#                        optional flat per-turn yields of the complete district
#                        (multiples of 0.1, default 0; #116, read by city_yield);
#                        none declared today
#   requires_tech        a [techs.*] name the owner must know to place it
#                        (#116 P2; checked through can_place_district)
#   requires_civic       accepted for #116 P4 (civics); passes until then
#   maintenance          gold per turn (multiple of 0.1, default 0; Civ 6:
#                        the gold districts pay for themselves); parsed and
#                        stored now, deducted from #116 P5 on
# Sources: terrain = {bases/relief/features/resources} (terrain_model `on`
# form), improvement = [...], district = [...] | "any" ("City Center" names a
# city centre; "any" = any district or centre), river_on_tile = true
# (adjacency only), river_edge_not_shared_with_center = true (requires_adjacent only).
[districts]
population_per_district = 3   # specialty districts allowed = 1 + floor((pop - 1) / 3)
cost_progress_factor = 9      # cost = base * (1 + 9 * P); P = techs known / techs in the tree (#116 P2)
removable_features = ["Woods", "Rainforest", "Marsh"]   # cleared on placement
allowed_features = ["Floodplains"]                      # kept on placement

[districts.Campus]
production_cost = 54
requires_tech = "Writing"
maintenance = 1
cost_model = "discounted"
discount_percent = 40
adjacency_yield = "science"
adjacency = [
    { amount = 1, terrain = { relief = ["mountain"] } },
    { amount = 1, per = 2, terrain = { features = ["Rainforest"] } },
    { amount = 2, terrain = { features = ["Reef"] } },
    { amount = 1, per = 2, district = "any" },
    { amount = 1, district = ["Government Plaza"] },
]

[districts."Commercial Hub"]
production_cost = 54
requires_tech = "Currency"
cost_model = "discounted"
discount_percent = 40
adjacency_yield = "gold"
adjacency = [
    { amount = 2, river_on_tile = true },
    { amount = 2, district = ["Harbor"] },
    { amount = 1, per = 2, district = "any" },
    { amount = 1, district = ["Government Plaza"] },
]

[districts."Theater Square"]
production_cost = 54
maintenance = 1
cost_model = "discounted"
discount_percent = 40
adjacency_yield = "culture"
adjacency = [
    { amount = 2, district = ["Entertainment Complex"] },
    { amount = 1, per = 2, district = "any" },
    { amount = 1, district = ["Government Plaza"] },
]

[districts."Holy Site"]
production_cost = 54
requires_tech = "Astrology"
maintenance = 1
cost_model = "discounted"
discount_percent = 40
adjacency_yield = "faith"
adjacency = [
    { amount = 1, terrain = { relief = ["mountain"] } },
    { amount = 1, per = 2, terrain = { features = ["Woods"] } },
    { amount = 1, per = 2, district = "any" },
    { amount = 1, district = ["Government Plaza"] },
]

[districts."Industrial Zone"]
production_cost = 54
requires_tech = "Apprenticeship"
maintenance = 1
cost_model = "discounted"
discount_percent = 40
adjacency_yield = "production"
adjacency = [
    { amount = 2, district = ["Aqueduct"] },
    { amount = 1, improvement = ["Quarry"] },
    { amount = 1, per = 2, improvement = ["Mine"] },
    { amount = 1, per = 2, district = "any" },
    { amount = 1, district = ["Government Plaza"] },
]

# Harbor: on Coast or Lake, adjacent to land (a mountain's base is land).
# "Not on Reef" needs no rule here: Reef is in neither removable_features nor
# allowed_features, so the general feature rule refuses it.
[districts.Harbor]
production_cost = 54
requires_tech = "Celestial Navigation"
cost_model = "discounted"
discount_percent = 40
adjacency_yield = "gold"
on = { bases = ["Coast", "Lake"] }
requires_adjacent = [
    { terrain = { bases = ["Grassland", "Plains", "Desert", "Tundra", "Snow"] } },
]
adjacency = [
    { amount = 2, district = ["City Center"] },
    { amount = 1, terrain = { bases = ["Coast", "Lake", "Ocean"], resources = ["any"] } },
    { amount = 1, per = 2, district = "any" },
    { amount = 1, district = ["Government Plaza"] },
]

[districts.Encampment]
production_cost = 54
requires_tech = "Bronze Working"
maintenance = 1
cost_model = "discounted"
discount_percent = 40
adjacent_to_city_center = false

[districts."Entertainment Complex"]
production_cost = 54
maintenance = 1
cost_model = "discounted"
discount_percent = 40

[districts."Government Plaza"]
production_cost = 30
cost_model = "discounted"
discount_percent = 25
max_per_player = 1

# Aqueduct: next to the centre and to a river (on an edge not shared with the
# centre), a lake, an oasis or a mountain. Water housing (§6, applied in D2):
# water = max(water_housing_min, water + water_housing_boost).
[districts.Aqueduct]
production_cost = 36
requires_tech = "Engineering"
cost_model = "progress"
counts_toward_limit = false
adjacent_to_city_center = true
requires_adjacent = [
    { river_edge_not_shared_with_center = true },
    { terrain = { bases = ["Lake"] } },
    { terrain = { features = ["Oasis"] } },
    { terrain = { relief = ["mountain"] } },
]
water_housing_min = 6
water_housing_boost = 2

[training]
episodes = 64
batch_size = 32
max_turns = 250
learning_rate = 0.001
gamma = 0.9
epsilon_start = 1.0
epsilon_end = 0.05
# 5000 was tuned for the old 8000-episode runs: a 1000-episode run only decayed
# epsilon to ~0.81, so every v0.6 run so far trained on ~81-100% random actions
# (the #46 eval's diagnostic finding). 800 reaches 0.05 by episode 800, leaving
# ~200 episodes of near-greedy self-play experience in a 1000-episode run.
epsilon_decay_episodes = 800
target_update_freq = 100 # Sync target network every N optimization steps
encoder = "enhanced"     # "basic" (5ch), "enhanced" (25ch/27ch fog), "terrain_aware" (52ch/54ch fog, #40), or "city_distance" (26ch/28ch fog, #48)
fully_conv = true        # Must be true for large maps (no FC layers)
fog_of_war = false       # true: enhanced encoder applies visibility (27ch — hidden/explored/visible)
# seed_base: episode-indexed seed schedule (issue #39, civulator/training/
# trainer.py train_agents's `seed_base` param + `_seeded_reset` docstring
# for the exact scheme). Absent (the default, as here) = unseeded episodes,
# unchanged from before this key existed. scripts/train.py reads this as
# its --seed-base default; scripts/run_baseline.py does NOT read it — the
# #39 baseline pins its own seed_base=390000 in code, deliberately not
# sourced from this mutable file.
# seed_base = 12345
# learning_starts: replay-buffer size a DQN agent's memory must reach before
# its first optimization step fires (issue #80, civulator/training/
# trainer.py train_agents's `learning_starts` param docstring for the exact
# resolution rule). Absent (the default, as here) = today's behaviour: the
# first update happens once the buffer exceeds batch_size, unchanged from
# before this key existed. Raising it delays the first gradient step until
# more experience has accumulated (the classic DQN "learning starts" knob) —
# a later, deliberately measured experiment variable, not a change made by
# adding this key.
# learning_starts = 1000

# Reward table v2 (issue #46, 2026-09-01): anti-turtling package. Old values
# in comments; the #39/#40 runs trained on those (their manifests pin them).
[training.rewards]
invalid_action = -1
fortify = 0
damage_per_hp = 0.1     # full kill ~ 10 damage + 10 kill = 20 (units have 100 HP)
kill = 10
unit_lost = -5          # was -10; proximity shaping adds a position-aware death penalty
capture_civilian = 15
capture_city = 80       # was 20; 4x a full kill, 2x founding
found_city = 40         # was 15; 2x a full kill
win = 100               # terminal, delivered by the trainer into final transitions
loss = -100
draw = 0                # deliberate: draw penalty is the next knob if games still hit the cap
proximity_weight = 0.5  # w in Phi = w * sum_military max(0, R - d_nearest_enemy_city); 0 disables
proximity_radius = 0    # R; 0 = auto (cols//2 + 1, scales with map preset)
