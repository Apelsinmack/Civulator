# Losing the race (design §9.2; Erik's March notes: soften the lost race):
# the share of a removed copy's locked cost refunded into its city's
# production pool, integer floor. Read only by civulator/district_model.py.
# 0 since #116 P9: a city's production pool is not sunk until a district
# completes (one number that a switch keeps, design §2.3), so the city that
# loses a race already keeps everything it put toward the lost copy and a
# refund on top was pure gain. The key stays for a future sunk-cost model,
# in which the pool would be spent at placement and a consolation would
# mean something.
[wonders]
consolation_percent = 0

[training]
episodes = 64
batch_size = 32
max_turns = 250
learning_rate = 0.001
gamma = 0.9
epsilon_start = 1.0
epsilon_end = 0.05
# 5000 was tuned for the old 8000-episode runs: a 1000-episode run only decayed
# epsilon to ~0.81, so every v0.6 run so far trained on ~81-100% random actions
# (the #46 eval's diagnostic finding). 800 reaches 0.05 by episode 800, leaving
# ~200 episodes of near-greedy self-play experience in a 1000-episode run.
epsilon_decay_episodes = 800
target_update_freq = 100 # Sync target network every N optimization steps
encoder = "enhanced"     # "basic" (5ch), "enhanced" (25ch/27ch fog), "terrain_aware" (52ch/54ch fog, #40), or "city_distance" (26ch/28ch fog, #48)
fully_conv = true        # Must be true for large maps (no FC layers)
fog_of_war = false       # true: enhanced encoder applies visibility (27ch — hidden/explored/visible)
# seed_base: episode-indexed seed schedule (issue #39, civulator/training/
# trainer.py train_agents's `seed_base` param + `_seeded_reset` docstring
# for the exact scheme). Absent (the default, as here) = unseeded episodes,
# unchanged from before this key existed. scripts/train.py reads this as
# its --seed-base default; scripts/run_baseline.py does NOT read it — the
# #39 baseline pins its own seed_base=390000 in code, deliberately not
# sourced from this mutable file.
# seed_base = 12345
# learning_starts: replay-buffer size a DQN agent's memory must reach before
# its first optimization step fires (issue #80, civulator/training/
# trainer.py train_agents's `learning_starts` param docstring for the exact
# resolution rule). Absent (the default, as here) = today's behaviour: the
# first update happens once the buffer exceeds batch_size, unchanged from
# before this key existed. Raising it delays the first gradient step until
# more experience has accumulated (the classic DQN "learning starts" knob) —
# a later, deliberately measured experiment variable, not a change made by
# adding this key.
# learning_starts = 1000

# Reward table v2 (issue #46, 2026-09-01): anti-turtling package. Old values
# in comments; the #39/#40 runs trained on those (their manifests pin them).
[training.rewards]
invalid_action = -1
fortify = 0
damage_per_hp = 0.1     # full kill ~ 10 damage + 10 kill = 20 (units have 100 HP)
kill = 10
unit_lost = -5          # was -10; proximity shaping adds a position-aware death penalty
capture_civilian = 15
capture_city = 80       # was 20; 4x a full kill, 2x founding
found_city = 40         # was 15; 2x a full kill
win = 100               # terminal, delivered by the trainer into final transitions
loss = -100
draw = 0                # deliberate: draw penalty is the next knob if games still hit the cap
proximity_weight = 0.5  # w in Phi = w * sum_military max(0, R - d_nearest_enemy_city); 0 disables
proximity_radius = 0    # R; 0 = auto (cols//2 + 1, scales with map preset)
